    url: https://www.ma-jan.or.jp/activity/game_rule.html
  - title: 最高位戦日本プロ麻雀協会 ルール概要
    url: https://saikouisen.com/about/rules/
  - title: 日本プロ麻雀協会 公式ルール
    url: https://npm2001.com/about/rule/
  - title: 日本健康麻将協会 ルール
    url: https://kenko-mahjong.com/rule_manner.php
  - title: Wikipedia「麻雀のルール」
    url: https://ja.wikipedia.org/wiki/麻雀のルール

    url: https://ja.wikipedia.org/wiki/麻雀の反則行為

caveats:
  - 雀魂のルールは、主にゲームの中で説明されている。ここでは、それをもとにした Wikipedia などの記述によった（ゲームの中の説明では確かめていない）。
  - 団体のルールは、年度ごとに改定されることがある。大会や雀荘は、それぞれ独自のルールを持つことが多い。
  - 日本プロ麻雀連盟の公式ルールは、ここ数年、年度ごとに改定されている（2023 年度に途中流局をやめた、など）。古い解説と食い違うことがあるので、その年度のルールを確かめる。
  - 「一般的」と言える統計は、見つからなかった。ここに書いたのは、6 つのルールと、いくつかの雀荘の例を読みくらべた結果。

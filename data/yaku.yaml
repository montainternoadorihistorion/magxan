# 役図鑑の内容。1 つの「- key: …」が、図鑑の 1 ページ。
#
# 牌の書き方： m 萬子 / p 筒子 / s 索子 / z 字牌（1 東 2 南 3 西 4 北 5 白 6 發 7 中）/ 0 赤い 5
#   hand  あがる前の門前の牌（鳴きが n 組なら 13 − 3n 枚）    win  あがり牌
#   melds 鳴き（「pon 888m」「chi 678p」「ankan 1111z」「minkan 5555s」「kakan 3333p」）
#   seat  自風（書かなければ 南＝子）    round 場風（書かなければ 東）
#   is_tsumo / riichi / ippatsu … あがりの状況（書かなければ「ロン、リーチなし」）
#
# examples（成立例）は、必ずその役が付く手。traps（ひっかけ例）は、付きそうで付かない手。
# どちらもテスト（tests/test_content.py）で点数計算にかけて、書いたとおりになることを確かめている。
#   expect: win         ほかの役であがれる
#           no_yaku     役がなく、あがれない
#           not_winning あがりの形になっていない
#           no_call     手の形ではなく、状況の決まりであがりを宣言できない
#
# 由来（origin）の certainty： 確実 / 有力 / 諸説あり / 不明。はっきりしないことは、断定せずにそう書く。

# ============================================================ 1 翻

- key: riichi
  group: han1
  short: 門前で聴牌したら「リーチ」と宣言する。ほかに役がなくても、これだけであがれるようになる。
  definition:
    - 門前である（チー・ポン・明槓をしていない。暗槓はしていてもよい）
    - 聴牌している（あと 1 枚であがりの形）
    - 自分の番で「リーチ」と発声し、牌を横向きに捨てて、1000 点棒を卓に出す
    - 宣言したあとは、手を変えられない（引いた牌があがり牌でなければ、そのまま捨てる）
  notes:
    - 出した 1000 点棒（供託）は、その局であがった人のものになる。流局したら、次の局に持ち越す。
    - リーチしてあがると、裏ドラをめくれる。1 巡以内にあがれば、一発も付く。
    - 自分のツモがもう残っていないときや、持ち点が 1000 点に足りないときにリーチできるかは、ルールによって異なる。
    - リーチのあとの暗槓は、待ちと面子の形が変わらない場合に限って認めるのが基本。細かい条件はルールによって異なる。
  kanji: 立＝立つ／直＝まっすぐ。なぜ聴牌の宣言をこう呼ぶのかは、はっきりしない。
  origin:
    text: >-
      配牌の 13 枚で聴牌を宣言し、手を変えずにあがる決まりが、1920 年代にアメリカで出た、中国のルールを紹介する本に載っている。
      これは、いまのダブル立直に当たる。局の途中で宣言する形は日本人が作ったとされるが、
      場所（満州にいた日本人か、日本国内か）と時期（昭和の初めから戦後まもなくまで）は、資料によって説明が分かれる。
      英語の reach が語源、という説明は俗説とされる。
    certainty: 諸説あり
  examples:
    - title: リーチのみ
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      note: 役は立直だけ。リーチをかけていなければ、この手はロンではあがれない（下のひっかけ例）。
    - title: リーチしてツモ、裏ドラが 2 枚
      hand: "123m456p789s23s44z"
      win: "1s"
      is_tsumo: true
      riichi: true
      dora: "9p"
      ura: "3z"
      note: 裏ドラ表示牌が西なので、裏ドラは北。雀頭の北 2 枚がドラになった。裏ドラは、リーチしてあがった人だけがもらえる。
  traps:
    - title: 聴牌しているが、リーチを宣言していない
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_yaku
      why: 聴牌していても、宣言しなければ立直は付かない。ほかに役がないので、ロンではあがれない（ツモなら門前清自摸和であがれる）。
    - title: 鳴いた手
      hand: "22334m99p"
      win: "4m"
      melds: ["chi 567s", "pon 111p"]
      expect: no_yaku
      why: 鳴いていると、聴牌していてもリーチは宣言できない。この手はほかに役もないので、ふつうはあがれない（山の最後の牌であがる海底摸月のように、状況で付く役が付くときは別）。
  good:
    - {key: ippatsu, why: リーチして 1 巡以内にあがると付く}
    - {key: menzen_tsumo, why: 門前なので、ツモれば必ず付く}
    - {key: pinfu, why: どちらも門前の役。両面待ちのリーチは、あがりやすい}
    - {key: tanyao, why: リーチ・タンヤオ・ピンフをまとめて「メンタンピン」と呼ぶ}
  never:
    - {key: double_riichi, why: 最初の番で宣言したリーチは、立直ではなくダブル立直として数える}
    - {key: tenhou, why: 配牌であがっているので、宣言する機会がない}
    - {key: chiihou, why: 最初のツモであがるので、宣言する機会がない}
  tips:
    - 門前で聴牌したら、まずリーチを考える。役がなくてもあがれるようになり、裏ドラと一発のぶん、打点も上がる。
    - 代わりに失うものは 2 つ。1000 点棒を出すことと、手を変えられなくなる（守れなくなる）こと。
    - 自分の捨て牌にあがり牌があるとき（フリテン）でもリーチはできるが、ロンではあがれず、ツモだけになる。
  practice: riichi

- key: ippatsu
  group: han1
  short: リーチを宣言してから 1 巡以内（次の自分のツモまで）にあがる。
  definition:
    - リーチ（またはダブル立直）を宣言している
    - 宣言してから、次の自分のツモまでのあいだにあがる（ほかの人の捨て牌でロンするか、次の自分のツモであがる）
    - そのあいだに、誰もチー・ポン・カンをしていない（鳴きが入ると、一発は消える）
  notes:
    - 一発や裏ドラを使わないルールもある（競技麻雀の一部。ルールによって異なる）。
    - 自分が暗槓をしても、一発は消える。
  kanji: 一発＝ 1 回で決める、という日本語。
  origin:
    text: >-
      日本で生まれた役。いつできたかは資料によって幅があり、原型が昭和 30 年ごろ、
      一般に広まったのが昭和 40 年代の後半から 50 年代、という説明がある。
    certainty: 諸説あり
  examples:
    - title: リーチ・一発（ロン）
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      ippatsu: true
      note: リーチの宣言から 1 巡のうちに、ほかの人が 2索 を捨てた。
    - title: リーチ・一発・ツモ
      hand: "234567m234p67s55s"
      win: "8s"
      is_tsumo: true
      riichi: true
      ippatsu: true
      note: リーチの次の自分のツモであがった。門前清自摸和・平和・断么九も付いて、満貫。
  traps:
    - title: リーチの直後に、ほかの人がポンをした
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      expect: win
      why: 1 巡のあいだに鳴きが入ると、一発は消える。立直の 1 翻は残る。
    - title: リーチしてから 2 回目のツモであがった
      hand: "123m456p789s13s44z"
      win: "2s"
      is_tsumo: true
      riichi: true
      expect: win
      why: 1 巡を過ぎているので、一発は付かない。立直と門前清自摸和は付く。
  good:
    - {key: riichi, why: リーチが前提なので、立直と一緒に付く（最初の番のリーチなら、立直ではなくダブル立直と付く）}
    - {key: menzen_tsumo, why: リーチの次のツモであがれば、両方付く}
  never:
    - {key: rinshan, why: カンをすると一発が消えるので、嶺上牌でのあがりに一発は付かない}
  tips:
    - 狙って作る役ではなく、リーチのおまけ。待ちの残り枚数が多いほど、1 巡以内にあがる確率も高い。
    - リーチされた側は、わざと鳴いて一発を消すことがある（一発消し）。
  practice: ippatsu

- key: menzen_tsumo
  group: han1
  short: 門前（鳴いていない手）で、自分で引いた牌であがる。
  definition:
    - 門前である（チー・ポン・明槓をしていない。暗槓はしていてもよい）
    - ツモであがる（自分で山から引いた牌であがる）
  notes:
    - ほかに役がない門前の手でも、ツモればこの役であがれる。ロンではあがれない。
    - 卓では、役を数えるときに「ツモ」と言う。
  kanji: 門前清＝門前（自分の手牌の前）が清らか＝何もさらしていない／自摸＝自分で牌を取る／和＝あがり。
  origin:
    text: >-
      「門前清」は、中国の華北の地方ルールにあった役とされる。
      日本では、1929 年にルールを統一した会議で「門前のツモあがりは 1 翻」と決まったとされる。
    certainty: 有力
  examples:
    - title: ツモのみ
      hand: "123m456p789s13s44z"
      win: "2s"
      is_tsumo: true
      note: リーチをかけていない、役のない手。ツモったので、門前清自摸和であがれる。
    - title: ツモ・平和（20 符）
      hand: "123456m234p67s55s"
      win: "8s"
      is_tsumo: true
      note: 平和のツモは、ツモの 2 符を付けず 20 符で計算する。
  traps:
    - title: 鳴いた手でツモ
      hand: "234m55p34s"
      win: "5s"
      melds: ["pon 888m", "chi 678p"]
      is_tsumo: true
      expect: win
      why: 鳴いているので、ツモっても門前清自摸和は付かない。この手は断么九であがれる。
    - title: 鳴いた役のない手でツモ
      hand: "22334m99p"
      win: "4m"
      melds: ["chi 567s", "pon 111p"]
      is_tsumo: true
      expect: no_yaku
      why: 鳴いた手は、ツモっても役が増えない。役がないので、ツモでもあがれない。
  good:
    - {key: riichi, why: どちらも門前の役。リーチしてツモれば 2 翻}
    - {key: pinfu, why: 門前の代表的な組み合わせ（ツモ・ピンフは 20 符）}
  never:
    - {key: houtei, why: 河底撈魚はロンの役}
    - {key: chankan, why: 槍槓はロンの役}
  tips:
    - 門前を保っていれば、役がなくてもツモであがれる。鳴かないことの保険になる。
    - 暗槓は、しても門前のまま。
  practice: menzen_tsumo

- key: tanyao
  group: han1
  short: 1・9・字牌を 1 枚も使わず、2〜8 の数牌だけで作る。
  definition:
    - 手牌 14 枚が、すべて中張牌（2〜8 の数牌）
    - 么九牌（1・9・字牌）が、雀頭も含めて 1 枚もない
  notes:
    - 鳴いても成立する（喰いタン）。ただし、鳴いた断么九を認めないルール（喰いタンなし）もある。ルールによって異なる。
  kanji: 断＝断つ／么＝ 1 ／九＝ 9 →「1 と 9 を断つ」。名前は 1 と 9 だが、字牌も使えない。
  origin:
    text: >-
      字のとおりの名前。戦前の日本の麻雀で、すでに 1 翻の役だった。
      中国でいつ・どこで生まれたのかを示す資料は、見つかっていない。
    certainty: 不明
  examples:
    - title: 門前のタンヤオ（嵌張待ちのロン）
      hand: "234m456p678s24s66p"
      win: "3s"
      note: 14 枚すべてが 2〜8。リーチをかけていなくても、断么九の 1 翻であがれる。
    - title: 鳴いたタンヤオ（喰いタン）
      hand: "234m55p34s"
      win: "5s"
      melds: ["pon 888m", "chi 678p"]
      note: 鳴いても 1 翻のまま。
  traps:
    - title: 雀頭が 9
      hand: "234m456p678s34s99p"
      win: "5s"
      expect: win
      why: 雀頭の 9筒 が么九牌。1 枚でも 1・9・字牌があると、断么九にならない（この手は平和であがれる）。
    - title: 待ちの片方が 1（片あがり）
      hand: "23m456p678s22s666s"
      win: "1m"
      expect: no_yaku
      why: 4萬 なら断么九だったが、1萬 では 123萬 になり、么九牌が入る。役がなくなり、あがれない。
    - title: 鳴いた手で、順子に 1 が入っている
      hand: "123m55p34s"
      win: "5s"
      melds: ["pon 888m", "chi 678p"]
      expect: no_yaku
      why: 123萬 の 1 が么九牌。断么九が付かず、ほかに役もないので、あがれない。
    - title: 「喰いタンなし」のルールで鳴いた
      hand: "234m55p34s"
      win: "5s"
      melds: ["pon 888m", "chi 678p"]
      rules: {kuitan: false}
      expect: no_yaku
      why: 喰いタンなしのルールでは、鳴いた断么九は役にならない。打つ前に、どちらのルールかを確かめておく。
  good:
    - {key: riichi, why: 門前で作れば、リーチと合わせやすい}
    - {key: pinfu, why: 2〜8 の順子で作れば、両方付く}
    - {key: sanshoku, why: 234〜678 の三色なら、両方付く}
    - {key: iipeikou, why: 2〜8 の同じ順子 2 組なら、両方付く}
  never:
    - {key: yakuhai, why: 役牌は字牌なので使えない}
    - {key: ittsu, why: 一気通貫には 1 と 9 が要る}
    - {key: chanta, why: 混全帯么九は、すべての面子に 1・9・字牌が要る}
    - {key: junchan, why: 純全帯么九は、すべての面子に 1・9 が要る}
    - {key: honitsu, why: 混一色には字牌が要る}
  tips:
    - 1・9・字牌から切っていくと、自然に近づく。
    - 鳴いても 1 翻なので、速くあがりたいときに使いやすい（喰いタンありのルール）。
    - 聴牌したら、待ちを確認する。23 で 1 と 4 を待つ形は、1 であがると断么九が付かない。
  practice: tanyao

- key: pinfu
  group: han1
  short: 符の付かない形。4 面子がすべて順子、雀頭が役牌でない、待ちが両面。
  definition:
    - 門前である
    - 4 つの面子がすべて順子（刻子・槓子が 1 つもない）
    - 雀頭が役牌でない（三元牌・場風・自風は使えない。数牌と、それ以外の風牌〈客風〉はよい）
    - 待ちが両面待ち（嵌張・辺張・単騎・双碰は不可）
  notes:
    - 「符が付く要素が 1 つもない形」が平和。4 つの条件は、どれも符が付かないための条件になっている。
    - ロンなら 30 符（門前ロンの 10 符）。ツモなら、例外としてツモの 2 符を付けず、20 符で計算する。
    - 平和とツモあがりを同時には認めないルール（ピンヅモなし）も、一部にある。そのルールでは、平和を数えず、ツモの 2 符を付けて計算する（ルールによって異なる）。
  kanji: 平＝平ら（点が少ない）／和＝あがり →「符の付かないあがり」。
  origin:
    text: >-
      中国由来。もとは、いちばん点の低いあがりの呼び名だった。日本で 1 翻の役になり、戦後に門前限定になった。
      古くは「ピンホー」と読んだ。
    certainty: 確実
  examples:
    - title: 平和のロン
      hand: "123m456p789s23s44z"
      win: "4s"
      note: 雀頭の北は、東場の南家にとって役牌ではない（客風）ので、平和になる。
    - title: 平和のツモ（20 符）
      hand: "123456m234p67s55s"
      win: "8s"
      is_tsumo: true
      note: 門前清自摸和と合わせて 2 翻 20 符。
  traps:
    - title: 嵌張待ち
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_yaku
      why: 13 で 2 を待つ形は嵌張。両面待ちでないので、平和にならない。
    - title: 雀頭が役牌
      hand: "123m456p789s23s11z"
      win: "4s"
      expect: no_yaku
      why: 雀頭の東は場風（役牌）。役牌の雀頭には 2 符が付くので、平和にならない。
    - title: 刻子がある
      hand: "222m456p789s23s99p"
      win: "4s"
      expect: no_yaku
      why: 222萬 が刻子。4 つとも順子でなければならない。
    - title: 1234 で 1 と 4 を待つ形
      hand: "1234m456p789s234s"
      win: "1m"
      expect: no_yaku
      why: 2 種類を待っていても、これは雀頭を待つ単騎待ち（延べ単騎）。両面待ちではない。
    - title: 鳴いた手
      hand: "234m55p34s"
      win: "5s"
      melds: ["chi 678p", "chi 345m"]
      expect: win
      why: 形は平和と同じでも、鳴くと平和は付かない（この手は断么九であがれる）。
  good:
    - {key: riichi, why: どちらも門前の役。両面待ちなのであがりやすい}
    - {key: tanyao, why: 2〜8 の順子で作れば、両方付く}
    - {key: menzen_tsumo, why: 門前なので、ツモれば付く}
    - {key: iipeikou, why: どちらも順子の役}
    - {key: sanshoku, why: どちらも順子の役}
    - {key: ittsu, why: どちらも順子の役}
  never:
    - {key: toitoi, why: 対々和は刻子だけ、平和は順子だけ}
    - {key: sanankou, why: 平和には刻子を使えない}
    - {key: yakuhai, why: 役牌は刻子で作る役}
    - {key: chiitoitsu, why: 七対子は順子を使わない別の形}
  tips:
    - 45 のように両側で待てる 2 枚（両面搭子）を大事に残すと、自然に平和になる。
    - 役牌の対子は雀頭に使えない。平和を狙うなら早めに切るか、ポンして役牌にするかを決める。
    - 聴牌のとき、嵌張と両面を選べるなら両面に取る。
  practice: pinfu

- key: iipeikou
  group: han1
  short: 同じ色・同じ数字の順子を 2 組そろえる（例：223344）。門前限定。
  definition:
    - 門前である
    - 同じ色で、同じ数字の並びの順子が 2 組ある（例：萬子の 234 が 2 組）
  notes:
    - 「同じ順子 2 組」が 2 つあると、二盃口（3 翻）になる。そのとき一盃口は数えない。
    - 七対子とは複合しない（七対子として読むとき、223344 は「対子 3 組」で、順子とは数えない）。
  kanji: 「盃」と「口」は、音に合わせた当て字で、役の中身とは関係がない。もとの表記は「一般高」とされる。
  origin:
    text: >-
      中国では目立たない役で、戦前の日本の麻雀では使われていなかった。戦後、関西のリーチ麻雀から広まった。
      「一盃口」の字は、呼び名が「一杯行こう」に聞こえたことから当てられた、と伝えられる。
    certainty: 有力
  examples:
    - title: 一盃口のみ
      hand: "223344m567p46s33z"
      win: "5s"
      note: 234萬 が 2 組。嵌張待ちで雀頭は西（客風）なので、ほかの役は付かない。
    - title: リーチ・平和・断么九・一盃口
      hand: "223344m567p67s55p"
      win: "8s"
      riichi: true
      note: 門前の役は重なりやすい。4 翻 30 符。
  traps:
    - title: 鳴いた手
      hand: "22334m99p"
      win: "4m"
      melds: ["chi 567s", "pon 111p"]
      expect: no_yaku
      why: 同じ順子は 2 組あるが、鳴いているので一盃口は付かない。ほかに役もないので、あがれない。
    - title: 色が違う
      hand: "234m234p567s67s55p"
      win: "8s"
      expect: win
      why: 234萬 と 234筒 は色が違う。同じ色でそろえるのが一盃口（この手は平和と断么九であがれる）。
    - title: 七対子として読む手
      hand: "223344m1199p55s7z"
      win: "7z"
      expect: win
      why: 残りの牌で面子を作れないので、この手は七対子。七対子では 223344 を「対子 3 組」と数えるので、一盃口は付かない。
  good:
    - {key: riichi, why: どちらも門前の役}
    - {key: pinfu, why: どちらも順子の役}
    - {key: tanyao, why: 2〜8 の順子で作れば、両方付く}
  never:
    - {key: chiitoitsu, why: 七対子として読むと、順子が無い}
    - {key: ryanpeikou, why: 2 つできたら、上位の二盃口だけを数える}
    - {key: toitoi, why: 対々和は刻子だけ}
  tips:
    - 2233 や 3344 のような「対子が並んだ形」に、同じ並びがあと 1 枚ずつ足りないときに見えてくる。
    - 鳴くと消えるので、門前で進める。
  practice: iipeikou

- key: yakuhai
  yaku: [yakuhai_haku, yakuhai_hatsu, yakuhai_chun, yakuhai_seat, yakuhai_round]
  group: han1
  name: 役牌
  reading: ヤクハイ
  spoken: 白なら「ハク」、東なら「トン」のように、牌の名前で言う
  han_text: 1 組につき 1 翻（鳴いても 1 翻）
  short: 白・發・中、場風、自風のどれかを 3 枚そろえる（刻子か槓子）。鳴いてもよい。
  definition:
    - 次のどれかの刻子（または槓子）がある：三元牌（白・發・中）／場風（東場なら東、南場なら南）／自風（自分の席の風。南家なら南）
    - 1 組につき 1 翻。2 組あれば 2 翻
    - 場風と自風が同じ牌（東場の東家の東）は、1 組で 2 翻（連風牌。「ダブ東」と呼ぶ）
  notes:
    - 鳴いても 1 翻のまま（喰い下がりなし）。
    - 2 枚（対子）だけでは役にならない。雀頭にすると 2 符が付くだけ。
    - 場風でも自風でもない風牌（客風）は、3 枚そろえても役にならない。
    - 連風牌を雀頭にしたときの符を 2 符とするか 4 符とするかは、ルールによって異なる。
  kanji: 役の付く牌。「翻牌」（翻が付く牌）とも書く。
  origin:
    text: 麻雀の最初期からある役。古いルールでは三元牌と自風だけが対象で、場風はあとから加わったとされる。
    certainty: 有力
  examples:
    - title: 白をポン
      hand: "123m456p23s99p"
      win: "4s"
      melds: ["pon 555z"]
      note: 役牌があれば、ほかの面子を鳴いて作ってもあがれる。
    - title: 自風の南を暗刻に（南家）
      hand: "222z123m456p23s99s"
      win: "4s"
      note: 門前のロン。リーチをかけていなくても、自風の 1 翻であがれる。
    - title: 東場の親が東を 3 枚（ダブ東）
      hand: "111z123m456p23s99s"
      win: "4s"
      seat: 東
      note: 東は場風でもあり自風でもある。1 組で 2 翻。
  traps:
    - title: 客風の刻子
      hand: "333z123m456p23s99s"
      win: "4s"
      expect: no_yaku
      why: 西は、東場の南家にとって場風でも自風でもない（客風）。3 枚そろえても役にならない。
    - title: 役牌が 2 枚だけ（雀頭）
      hand: "123m456p789s23s55z"
      win: "4s"
      expect: no_yaku
      why: 白は 2 枚（雀頭）だけ。3 枚そろえないと役にならない。雀頭が役牌なので、平和も付かない。
  good:
    - {key: honitsu, why: 字牌を使う役どうし。鳴いて速く作れる}
    - {key: toitoi, why: 刻子の役どうし}
    - {key: shousangen, why: 小三元には、三元牌の役牌が必ず 2 組付く}
    - {key: chanta, why: 字牌の刻子は、混全帯么九の面子になる}
  never:
    - {key: pinfu, why: 平和は順子だけ。役牌の雀頭も使えない}
    - {key: tanyao, why: 字牌は么九牌}
    - {key: chiitoitsu, why: 七対子には刻子が無い}
    - {key: junchan, why: 純全帯么九は字牌を使えない}
    - {key: chinitsu, why: 清一色は字牌を使えない}
  tips:
    - 配牌に役牌の対子があれば、1 枚目が出たときにポンして役を確定させるのが基本（鳴いても 1 翻）。
    - 役牌があれば、あとの面子は鳴いて作ってもあがれる。
    - どれが役牌かは、場と席で変わる。自分の席の風と、いまの場の風を最初に確かめる。
  practice: yakuhai

- key: rinshan
  group: han1
  short: カンをして、補充で引いた牌（嶺上牌）であがる。
  definition:
    - カン（暗槓・加槓・大明槓）をする
    - その補充として王牌から引く 1 枚（嶺上牌）で、ツモあがりする
  notes:
    - 鳴いていても成立する。門前（暗槓だけ）なら、門前清自摸和も付く。
    - 大明槓からの嶺上開花を、カンをさせた人の責任払いにするルールもある（ルールによって異なる）。
  kanji: 嶺上＝山の頂／開花＝花が開く。
  origin:
    text: >-
      中国由来の古い役。カンの補充牌を王牌の上に置き直したので、山の頂（嶺）のように見えたことから、
      その牌を「嶺上牌」と呼ぶようになったとされる。
    certainty: 有力
  examples:
    - title: 明槓して嶺上開花
      hand: "123m567p34s66s"
      win: "5s"
      melds: ["minkan 8888p"]
      is_tsumo: true
      rinshan: true
      note: 鳴いていてほかに役がない手でも、嶺上開花の 1 翻であがれる。
    - title: 東を暗槓して嶺上開花（門前）
      hand: "123m456p78s22p"
      win: "9s"
      melds: ["ankan 1111z"]
      is_tsumo: true
      rinshan: true
      note: 暗槓だけなら門前のまま。門前清自摸和と、場風の東も付く。
  traps:
    - title: カンをした次の巡目に、ふつうのツモであがった
      hand: "123m567p34s66s"
      win: "5s"
      melds: ["minkan 8888p"]
      is_tsumo: true
      expect: no_yaku
      why: 嶺上牌であがったときだけ付く。次の巡目のツモには付かない。鳴いていて役がないので、この手はあがれない。
    - title: ほかの人がカンをして、そのあと捨てた牌でロン
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      expect: win
      why: 嶺上開花は、自分がカンをして引いた牌でのツモあがり。ほかの人のカンは関係ない（この手は立直であがれる）。
  combo_note: 手の形に関係なく付くので、多くの役と一緒に付く。ツモあがりなので、ロンの役（河底撈魚・槍槓）とは付かない。
  never:
    - {key: haitei, why: 嶺上牌は、山の最後の牌（海底牌）ではない}
    - {key: ippatsu, why: カンをすると一発は消える}
    - {key: houtei, why: 河底撈魚はロンの役}
    - {key: chankan, why: 槍槓はロンの役}
  tips:
    - 狙って作る役ではない。聴牌していて 4 枚目を引いたとき、「カンをすれば、もう 1 枚引ける」と覚えておく。
    - カンをするとドラ（槓ドラ）が増え、相手の打点も上がる。聴牌していないときのカンは慎重に。
  practice_note: カンが要る役。一人練習ではカンができない（今後の版の、CPU との対局で使えるようにする予定）。
  solo: false

- key: chankan
  group: han1
  short: ほかの人が加槓しようとした牌が、自分のあがり牌だったときにロンする。
  definition:
    - ほかの人が、ポンした刻子に 4 枚目を加える「加槓」を宣言する
    - その加えた牌が自分のあがり牌なら、ロンできる
  notes:
    - 槍槓になるのは、加槓のときだけ。暗槓の牌では、ロンできない。
    - 例外として、国士無双だけは暗槓の牌でもロンできる、とするルールがある（ルールによって異なる）。
    - 大明槓は、ほかの人の捨て牌をもらうカンなので、槍槓にはならない。その捨て牌が自分のあがり牌なら、カンより先に、ふつうのロンができる（槍槓の 1 翻は付かない）。
    - 槍槓されたカンは成立しない。槓ドラもめくらない。
  kanji: 本来の字は「搶槓」。搶＝奪う／槓＝カン →「カンを奪ってあがる」。
  origin:
    text: 中国由来の古い役。1914 年に上海で出た本に、すでに載っている。
    certainty: 確実
  examples:
    - title: 槍槓のみ
      hand: "123m456p789s13s44z"
      win: "2s"
      chankan: true
      note: ほかの人が 2索 をポンしていて、4 枚目を加槓しようとした。その 2索 でロン。
    - title: 鳴いた手で槍槓
      hand: "234m55p34s"
      win: "5s"
      melds: ["pon 888m", "chi 678p"]
      chankan: true
      note: 断么九と合わせて 2 翻。
  traps:
    - title: ほかの人が暗槓した牌が、自分のあがり牌だった
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_call
      why: 槍槓でロンできるのは、加槓の牌だけ。暗槓の牌には、ロンできない（国士無双の例外を認めるルールを除く）。
    - title: 自分の捨て牌に、あがり牌がある（フリテン）
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_call
      why: 槍槓はロンあがりの一種。フリテンのときはロンできないので、槍槓もできない。
  combo_note: 手の形に関係なく付くので、多くの役と一緒に付く。ロンあがりなので、ツモの役とは付かない。
  never:
    - {key: menzen_tsumo, why: 槍槓はロンの役}
    - {key: rinshan, why: 嶺上開花はツモの役}
    - {key: haitei, why: 海底摸月はツモの役}
    - {key: houtei, why: 加槓の牌は、最後の捨て牌ではない}
  tips:
    - 狙って作る役ではない。ほかの人がポンしている牌で待っているとき、「加槓されたらロンできる」と覚えておく。
    - 自分が加槓するときは、その牌が誰かのあがり牌かもしれない、と一度考える。
  practice_note: ほかの人の加槓が要る役なので、相手のいる対局が必要（今後の版の、CPU との対局で成立する予定）。
  solo: false

- key: haitei
  group: han1
  short: 山の最後の 1 枚（海底牌）をツモってあがる。
  definition:
    - その局でツモれる最後の牌（海底牌）を引く
    - その牌でツモあがりする
  notes:
    - 鳴いていても成立する。門前なら、門前清自摸和も付く。
    - 海底牌を引いた人は、カンができない。
    - 「海底撈月」（ハイテイラオユエ）とも書く。
  kanji: 海底＝海の底（山の最後の牌）／摸月＝月をさぐり取る。
  origin:
    text: >-
      中国由来の古い役。水に映った月をすくおうとする、という意味の四字熟語「海底撈月」から。
      最後の牌が 1筒（丸い模様を月に見立てる）のときだけを、特別に高い役（一筒摸月・イーピンモーユエ）として扱う古い決まりもあった。
    certainty: 有力
  examples:
    - title: 鳴いた手で海底ツモ
      hand: "123m567p34s66s"
      win: "5s"
      melds: ["pon 888p"]
      is_tsumo: true
      haitei: true
      note: 鳴いていてほかに役がない手でも、海底牌ならあがれる。
    - title: 門前で海底ツモ
      hand: "123m456p789s13s44z"
      win: "2s"
      is_tsumo: true
      haitei: true
      note: 門前清自摸和と合わせて 2 翻。
  traps:
    - title: 最後から 2 枚目のツモであがった
      hand: "123m567p34s66s"
      win: "5s"
      melds: ["pon 888p"]
      is_tsumo: true
      expect: no_yaku
      why: 海底牌（最後の 1 枚）でなければ付かない。鳴いていて役がないので、この手はあがれない。
    - title: 海底牌を引いた人が捨てた牌でロン
      hand: "123m456p789s13s44z"
      win: "2s"
      houtei: true
      expect: win
      why: 最後の捨て牌でのロンは、別の役「河底撈魚」になる。
  combo_note: 手の形に関係なく付くので、多くの役と一緒に付く。
  never:
    - {key: rinshan, why: 嶺上牌は海底牌ではない}
    - {key: houtei, why: 河底撈魚はロンの役}
    - {key: chankan, why: 槍槓はロンの役}
  tips:
    - 狙って作る役ではない。流局が近いとき、「最後のツモなら、役がなくてもあがれる」と覚えておく。
  practice_note: 一人練習の最後のツモは、本当の山の最後の牌ではないので、この役は付かない（今後の版の、CPU との対局で成立する予定）。
  solo: false

- key: houtei
  group: han1
  short: その局の最後の捨て牌（河底牌）でロンする。
  definition:
    - その局の最後の捨て牌（ふつうは、海底牌を引いた人が捨てた牌）
    - その牌でロンあがりする
  notes:
    - 鳴いていても成立する。
    - 最後の捨て牌は、チー・ポン・カンができない（ロンだけできる）。
  kanji: 河底＝河（捨て牌の並ぶ場所）の最後／撈魚＝魚をすくう。
  origin:
    text: >-
      名前は日本生まれ。昭和 5 年（1930 年）に日本麻雀連盟のルールで採用され、木村衛が名付けたとされる。
      海底摸月と対になる名前。
    certainty: 確実
  examples:
    - title: 河底のみ
      hand: "123m456p789s13s44z"
      win: "2s"
      houtei: true
      note: リーチをかけていない役のない手でも、最後の捨て牌ならロンできる。
    - title: 鳴いた手で河底
      hand: "123m567p34s66s"
      win: "5s"
      melds: ["pon 888p"]
      houtei: true
  traps:
    - title: 最後から 2 枚目の捨て牌
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_yaku
      why: 最後の捨て牌でなければ付かない。役がないので、ロンできない。
    - title: 最後の捨て牌があがり牌だが、自分も同じ牌を捨てている（フリテン）
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_call
      why: ロンの役なので、フリテンではあがれない。最後の捨て牌でも同じ。
  combo_note: 手の形に関係なく付くので、多くの役と一緒に付く。ロンあがりなので、ツモの役とは付かない。
  never:
    - {key: haitei, why: 海底摸月はツモの役}
    - {key: menzen_tsumo, why: 河底撈魚はロンの役}
    - {key: rinshan, why: 嶺上開花はツモの役}
    - {key: chankan, why: 加槓の牌は、最後の捨て牌ではない}
  tips:
    - 流局まぎわに聴牌していれば、最後の捨て牌でロンできるかもしれない。
    - 自分が最後の牌を捨てるときは、聴牌していそうな人のあがり牌を出さないように気をつける。
  practice_note: ロンであがる役なので、相手のいる対局が必要（今後の版の、CPU との対局で成立する予定）。
  solo: false

# ============================================================ 2 翻

- key: double_riichi
  group: han2
  short: 最初の自分の番で（誰も鳴かないうちに）リーチを宣言する。立直の代わりに 2 翻。
  definition:
    - 門前で、最初の自分の番に聴牌している
    - 自分の最初の捨て牌で、リーチを宣言する
    - それより前に、誰もチー・ポン・カンをしていない（暗槓も含む）
  notes:
    - 立直（1 翻）の代わりに数える。立直と足して 3 翻にはならない。
    - 一発と裏ドラは、ふつうのリーチと同じように付く。
    - 宣言したあとの決まり（手を変えられない、など）も、ふつうのリーチと同じ。
  kanji: ダブル（英語の double）＋立直。「二重立直」「W 立直」とも書く。卓では「ダブリー」と言う。
  origin:
    text: >-
      配牌で聴牌を宣言するこの形が、もともとの「立直」だった。
      戦後、局の途中で宣言する形が単に「立直」と呼ばれるようになり、区別のために、元の形に「ダブル」を付けた。なぜ「ダブル」なのかは、
      「ふつうの立直の 2 倍で 2 翻だから」という説明と、「もとの立直と途中の立直が重なった役だから」という説明がある。
    certainty: 諸説あり
  examples:
    - title: ダブル立直のみ
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      double_riichi: true
      note: 役はダブル立直だけで 2 翻。
    - title: ダブル立直・一発・ツモ・平和
      hand: "123456m234p67s55s"
      win: "8s"
      is_tsumo: true
      riichi: true
      double_riichi: true
      ippatsu: true
      note: 2 ＋ 1 ＋ 1 ＋ 1 ＝ 5 翻で、満貫。
  traps:
    - title: 2 巡目に聴牌して、リーチした
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      expect: win
      why: 最初の番を過ぎているので、ふつうの立直（1 翻）になる。
    - title: 最初の番の前に、ほかの人がポンをした
      hand: "123m456p789s13s44z"
      win: "2s"
      riichi: true
      expect: win
      why: 自分の最初の捨て牌より前に、誰かの鳴きが入ると、ダブル立直にならない。ふつうの立直（1 翻）になる。
  good:
    - {key: ippatsu, why: ふつうのリーチと同じように付く}
    - {key: menzen_tsumo, why: 門前なので、ツモれば付く}
    - {key: pinfu, why: どちらも門前の役}
  never:
    - {key: riichi, why: 立直の代わりに数える（両方は数えない）}
    - {key: tenhou, why: 親が配牌であがっていれば、宣言せずに天和}
    - {key: chiihou, why: 子が最初のツモであがっていれば、宣言せずに地和}
  tips:
    - 狙って作る役ではない。配牌を並べたら、まず「もう聴牌していないか」を確かめる。
    - 相手は捨て牌の情報がほとんどないので、待ちが悪くても当たり牌が出やすい。
    - 最初の番で聴牌していても、誰かが先に鳴いたら、ふつうのリーチになる。
  practice: double_riichi

- key: chiitoitsu
  group: han2
  short: 同じ牌 2 枚の組（対子）を 7 組そろえる。4 面子 1 雀頭ではない、特別な形。
  definition:
    - 門前である（対子は鳴いて作れない）
    - 対子が 7 組ある
    - 7 組はすべて違う牌（同じ牌 4 枚を、2 組には数えない）
  notes:
    - 符は 25 符で固定（切り上げない）。ツモでも 25 符のまま。
    - 待ちは必ず単騎待ち（残り 1 枚の牌と同じ牌を待つ。あがり牌は最大 3 枚）。
    - 同じ牌 4 枚を 2 組として認めるルールも、一部にある（ルールによって異なる）。
    - 4 面子 1 雀頭の形ではないので、順子や刻子が要る役とは複合しない。
  kanji: 七つの対子。対子＝同じ牌 2 枚の組。卓では「チートイ」と略す。
  origin:
    text: >-
      起源は説が分かれる。「アメリカ人が、ポーカーのペアから考えた」という説明が日本の入門書には多い。
      一方、1920 年代にアメリカで出たルールブックは「中国人はあまり使わない役」として紹介していて、
      アメリカで生まれたとは書いていない。アメリカで人気が出て広まったことは、どの資料も一致する。
      日本では、はじめ「アメリカ」と呼ばれたという。
    certainty: 諸説あり
  examples:
    - title: 七対子のみ（25 符 2 翻）
      hand: "2255m3399p4466s1z"
      win: "1z"
      note: 残り 1 枚の東と同じ牌を待つ単騎待ち。子のロンで 1600 点。
    - title: ツモ・七対子（25 符 3 翻）
      hand: "1199m3355p2288s7z"
      win: "7z"
      is_tsumo: true
      note: 七対子はツモでも 25 符。子で 800・1600 点。
    - title: リーチ・七対子・断么九
      hand: "2244m5577p3366s8s"
      win: "8s"
      riichi: true
      note: 2〜8 だけで作れば、断么九も付く。4 翻 25 符で 6400 点。
  traps:
    - title: 同じ牌が 4 枚ある
      hand: "2222m5577p3366s8s"
      win: "8s"
      expect: not_winning
      why: 2萬 の 4 枚は、対子 2 組に数えない。対子は 6 組しかなく、4 面子 1 雀頭にもならないので、あがりの形ではない。
    - title: 4 面子 1 雀頭としても読める手
      hand: "223344m556677p8s"
      win: "8s"
      expect: win
      why: 対子 7 組にも見えるが、234萬・234萬・567筒・567筒＋雀頭とも読める。点の高い読み方（二盃口）で数えるので、七対子は付かない。
    - title: 対子 4 組と、刻子 2 組
      hand: "1199m3355p22888s"
      win: "2s"
      expect: not_winning
      why: 同じ牌が 3 枚になっても、対子は増えない。7 組すべてが「2 枚ずつ」でなければならない。
  good:
    - {key: riichi, why: 門前の役。単騎待ちは、相手から読まれにくい}
    - {key: menzen_tsumo, why: 門前なので、ツモれば付く}
    - {key: tanyao, why: 2〜8 の対子だけで作れば付く}
    - {key: honitsu, why: 1 色と字牌の対子だけで作れば付く}
    - {key: honroutou, why: 1・9・字牌の対子だけで作れば付く}
  never:
    - {key: pinfu, why: 平和は 4 面子 1 雀頭の役}
    - {key: iipeikou, why: 七対子として読むと、順子が無い}
    - {key: ryanpeikou, why: 両方に読める手は、高い方の二盃口で数える}
    - {key: toitoi, why: 対々和は刻子 4 つの形}
    - {key: sanankou, why: 七対子に刻子は無い}
    - {key: yakuhai, why: 役牌は 3 枚そろえる役。対子では付かない}
  tips:
    - 配牌に対子が 4 組以上あれば候補になる。対子が 5 組あれば一向聴（あと 1 枚で聴牌）。
    - 待つ牌を自分で選べる。字牌や 1・9 など、相手が持っていても使いにくい牌で待つと、出やすい。
    - 対子をポンすると、七対子にはできなくなる。鳴いて対々和に向かうか、鳴かずに七対子を続けるかを、早めに決める。
  practice: chiitoitsu

- key: toitoi
  group: han2
  short: 4 つの面子を、すべて刻子（同じ牌 3 枚）か槓子で作る。鳴いてもよい。
  definition:
    - 4 つの面子が、すべて刻子か槓子（順子が 1 つもない）
    - 鳴いて作ってもよい（ポン・カン）。2 翻のまま
  notes:
    - 門前で 4 つとも暗刻にすると、役満の四暗刻になる（ツモあがりのとき。単騎待ちならロンでも）。
    - 門前でも、双碰待ちをロンであがると、その 1 組は明刻になる。このときは対々和＋三暗刻。
    - 刻子が多いので、符が高くなりやすい。
  kanji: 対＝同じ牌の組／和＝あがり。中国語では「碰碰和」とも言う。卓では「トイトイ」と略す。
  origin:
    text: >-
      中国由来の古い役。はじめは符が付くだけだったが、のちに 1 翻、いまは 2 翻になった。
      名前は、ポンをするときの古い掛け声「対（トイ）」から来たという説明と、
      相づちの「対々」から来たという説明があり、定まっていない。
    certainty: 諸説あり
  examples:
    - title: 鳴いた対々和
      hand: "222m66s99p"
      win: "9p"
      melds: ["pon 888m", "pon 333s"]
      note: 2 回ポンして、対子 2 組のどちらかを待つ形（双碰待ち）。役は対々和だけで 2 翻。
    - title: 対々和・役牌
      hand: "222m66s88s"
      win: "8s"
      melds: ["pon 555z", "pon 999p"]
      note: 白のポンがあるので 3 翻。
    - title: 対々和・三暗刻（1 回ポン、ツモ）
      hand: "222m444p66s99s"
      win: "9s"
      melds: ["pon 888m"]
      is_tsumo: true
      note: ツモった 9索 の刻子は暗刻。手の中の暗刻が 3 つになり、三暗刻も付く。
  traps:
    - title: 順子が 1 つある
      hand: "222m66s99p"
      win: "9p"
      melds: ["pon 888m", "chi 345s"]
      expect: no_yaku
      why: 345索 が順子。4 つとも刻子（槓子）でなければ、対々和にならない。ほかに役がないので、あがれない。
    - title: 門前で、4 つとも暗刻にしてツモ
      hand: "222m888m444p66s99s"
      win: "9s"
      is_tsumo: true
      expect: win
      why: 4 つとも暗刻なら、役満の四暗刻になる。役満のときは、ふつうの役（対々和）は数えない。
  good:
    - {key: yakuhai, why: 役牌の刻子は、そのまま対々和の面子になる}
    - {key: sanankou, why: 暗刻が 3 つあれば、両方付く}
    - {key: honitsu, why: 1 色と字牌の刻子で作れば、両方付く}
    - {key: honroutou, why: 1・9・字牌の刻子だけで作れば、両方付く}
    - {key: tanyao, why: 2〜8 の刻子だけで作れば、両方付く（喰いタンありのルール）}
  never:
    - {key: pinfu, why: 平和は順子だけ}
    - {key: iipeikou, why: 一盃口は順子の役}
    - {key: sanshoku, why: 三色同順は順子の役}
    - {key: ittsu, why: 一気通貫は順子の役}
    - {key: chanta, why: 混全帯么九には順子が要る。順子が無ければ混老頭}
    - {key: junchan, why: 純全帯么九には順子が要る}
    - {key: chiitoitsu, why: 七対子は対子 7 組の別の形}
  tips:
    - 対子が 4 組以上あって、字牌や 1・9（ほかの人が早めに捨てる牌）が多いときに向く。
    - ポンは誰の捨て牌からでもできるので、速い。役牌の対子があると、さらに安心。
    - 鳴くたびに手牌が減り、守りにくくなる。点が安いときは、無理に鳴かない。
  practice_note: 一人練習は鳴けないので、4 つの刻子をそろえてツモると四暗刻（役満）になり、対々和としては数えない。今後の版の、鳴きのある対局で練習できるようにする予定。
  solo: false

- key: sanankou
  group: han2
  short: 暗刻（自分で 3 枚そろえた刻子）を 3 つ作る。残りの 1 面子は何でもよい。
  definition:
    - 暗刻が 3 つある（暗槓も暗刻に数える）
    - 残りの 1 面子は、順子でも、鳴いた面子でもよい
  notes:
    - ロンで完成した刻子は、明刻として数える。双碰待ちをロンであがると、その 1 組は暗刻にならない。
    - 鳴いていても、暗刻が 3 つあれば成立する（2 翻のまま）。
    - 暗刻が 4 つなら、役満の四暗刻。
  kanji: 三つの暗刻。暗＝手の内にある（見せていない）／刻＝刻子。
  origin:
    text: 中国（上海）のルールにあった役。1923 年にアメリカで出たルールブックに、「手の内の 3 枚組 3 つ」の役として載っている。
    certainty: 確実
  examples:
    - title: 三暗刻のみ（順子の待ちをロン）
      hand: "222m444p888s34m11p"
      win: "5m"
      note: ロンした牌は 345萬 の順子に使った。3 つの刻子は自分でそろえたものなので、暗刻のまま。
    - title: チーしていても成立
      hand: "222m444p999s3m"
      win: "3m"
      melds: ["chi 678s"]
      note: 鳴いた面子が 1 つあっても、暗刻が 3 つあればよい。
    - title: 双碰待ちをツモ
      hand: "222m444p88s99s567p"
      win: "9s"
      is_tsumo: true
      note: ツモなら、999索 も暗刻。門前清自摸和と合わせて 3 翻。
  traps:
    - title: 双碰待ちをロン
      hand: "222m444p88s99s567p"
      win: "9s"
      expect: no_yaku
      why: ロンで完成した 999索 は、明刻として数える。暗刻は 2 つだけ。ほかに役がないので、ロンではあがれない。
    - title: ポンした刻子が混ざっている
      hand: "222m444p34m11p"
      win: "5m"
      melds: ["pon 999s"]
      expect: no_yaku
      why: ポンした 999索 は明刻。暗刻は 222萬 と 444筒 の 2 つだけなので、三暗刻にならない。
  good:
    - {key: toitoi, why: 残りの 1 面子も刻子なら、両方付く}
    - {key: yakuhai, why: 役牌の暗刻は、暗刻の 1 つに数える}
    - {key: riichi, why: 門前なら、リーチをかけられる}
    - {key: menzen_tsumo, why: 門前の双碰待ちは、ツモなら三暗刻も付く}
    - {key: sanshoku_doukou, why: 同じ数字の暗刻 3 つなら、両方付く}
  never:
    - {key: pinfu, why: 平和は順子だけ}
    - {key: chiitoitsu, why: 七対子に刻子は無い}
    - {key: sanshoku, why: 順子 3 つと暗刻 3 つは、同時に作れない}
    - {key: ittsu, why: 順子 3 つと暗刻 3 つは、同時に作れない}
    - {key: ryanpeikou, why: 二盃口は順子 4 つ}
  tips:
    - 暗刻が 2 つあって、対子も残っているときに見えてくる。
    - 3 つ目も自分で引かなければならない。ポンすると、その刻子は暗刻に数えない。
    - 聴牌が双碰待ちになったら、ロンでは 1 組が明刻になる。ロンでもあがれるように、リーチなどほかの役を付けておく。
  practice: sanankou

- key: sanshoku
  group: han2
  short: 萬子・筒子・索子の 3 色で、同じ数字の順子を作る（例：234萬・234筒・234索）。
  definition:
    - 萬子・筒子・索子のそれぞれに、同じ数字の並びの順子がある
    - 門前なら 2 翻、鳴くと 1 翻（喰い下がり）
  notes:
    - 残りの 1 面子と雀頭は、何でもよい。
    - あがり牌によって、三色になる方（高目）と、ならない方（安目）に分かれることが多い。
  kanji: 三色＝萬子・筒子・索子の 3 種類／同順＝同じ並びの順子。卓では「サンショク」と略す。
  origin:
    text: >-
      中国から伝わった役。日本で広まったのが戦後なので、日本生まれと思われることがあるが、
      1920 年代に大連で出た日本語の本に、すでに別の名前で紹介されている。
    certainty: 有力
  examples:
    - title: 門前の三色同順（嵌張待ち）
      hand: "234m234p24s789m44z"
      win: "3s"
      note: 234 が 3 色にそろった。役は三色同順だけで 2 翻。
    - title: 鳴いた三色同順（1 翻）
      hand: "234m23s789m44z"
      win: "4s"
      melds: ["chi 234p"]
      note: 鳴くと 1 翻に下がる。
    - title: リーチ・平和・断么九・三色同順（高目）
      hand: "345m345p34s678m66p"
      win: "5s"
      riichi: true
      note: 5索 なら三色が付いて 5 翻（満貫）。2索 でもあがれるが、234索 になるので三色は付かない。
  traps:
    - title: 数字が 1 つずつずれている
      hand: "234m345p45s789m44z"
      win: "6s"
      expect: win
      why: 234・345・456 と、数字がずれている。3 色とも同じ数字の並びでなければならない（この手は平和であがれる）。
    - title: 安目であがった
      hand: "234m234p23s789m44z"
      win: "1s"
      expect: win
      why: 4索 なら 234 がそろって三色同順。1索 では 123索 になり、三色にならない（平和だけになる）。
    - title: 同じ色に 2 組
      hand: "234m234m23s789p44z"
      win: "4s"
      expect: win
      why: 234 は萬子に 2 組と索子に 1 組。筒子に無いので、三色にならない（この手は一盃口と平和）。
  good:
    - {key: pinfu, why: どちらも順子の役}
    - {key: tanyao, why: 234〜678 の三色なら、両方付く}
    - {key: riichi, why: 門前で作れば、リーチと合わせやすい}
    - {key: junchan, why: 123 か 789 の三色は、純全帯么九と相性がよい}
    - {key: chanta, why: 123 か 789 の三色は、混全帯么九と相性がよい}
  never:
    - {key: toitoi, why: 対々和は刻子だけ}
    - {key: sanankou, why: 順子 3 つと暗刻 3 つは、同時に作れない}
    - {key: chiitoitsu, why: 七対子に順子は無い}
    - {key: ittsu, why: 一気通貫は 1 色で順子 3 つ。面子が足りない}
    - {key: honitsu, why: 混一色は数牌が 1 色だけ}
    - {key: chinitsu, why: 清一色は数牌が 1 色だけ}
    - {key: sanshoku_doukou, why: 順子 3 つと刻子 3 つは、同時に作れない}
  tips:
    - 2 色で同じ並びの順子（やその手前の形）ができたら、3 色目を意識して残す。
    - 3456 のように、345 にも 456 にも取れる形は、三色の数字を合わせやすい。
    - 聴牌したら、どの牌であがると三色が付くのか（高目）を確かめる。安目では役がなくなる手は、リーチをかけておく。
  practice: sanshoku

- key: sanshoku_doukou
  group: han2
  short: 萬子・筒子・索子の 3 色で、同じ数字の刻子を作る（例：333萬・333筒・333索）。
  definition:
    - 萬子・筒子・索子のそれぞれに、同じ数字の刻子（または槓子）がある
    - 鳴いて作ってもよい（2 翻のまま）
  notes:
    - 同じ数字の牌は 3 色で 12 枚しかなく、そのうち 9 枚を使う。めったにできない。
    - 残りの 1 面子と雀頭は、何でもよい。
  kanji: 三色＝ 3 種類の数牌／同刻＝同じ数字の刻子。
  origin:
    text: 中国に、同じ形の役（三同刻）がある。日本で「三色同刻」の名前で広まったのは、戦後とされる。
    certainty: 有力
  examples:
    - title: 2 つポンした三色同刻
      hand: "333s45m99p"
      win: "6m"
      melds: ["pon 333m", "pon 333p"]
      note: 3 の刻子が 3 色にそろった。役は三色同刻だけで 2 翻。
    - title: 門前の三色同刻・三暗刻
      hand: "222m222p222s67m99s"
      win: "8m"
      note: 3 つとも暗刻なので、三暗刻も付いて 4 翻。
  traps:
    - title: 刻子は 2 色だけ
      hand: "345s45m99p"
      win: "6m"
      melds: ["pon 333m", "pon 333p"]
      expect: no_yaku
      why: 3 の刻子は萬子と筒子だけ。索子は 345 の順子で、3 が 1 枚あるだけ。役がないので、あがれない。
    - title: 数字が違う
      hand: "444s45m99p"
      win: "6m"
      melds: ["pon 333m", "pon 333p"]
      expect: no_yaku
      why: 索子の刻子が 444。3 色とも同じ数字でなければならない。
  good:
    - {key: toitoi, why: 残りの 1 面子も刻子なら、両方付く}
    - {key: sanankou, why: 3 つとも暗刻なら、両方付く}
  never:
    - {key: pinfu, why: 平和は順子だけ}
    - {key: sanshoku, why: 順子 3 つと刻子 3 つは、同時に作れない}
    - {key: ittsu, why: 一気通貫は順子 3 つ}
    - {key: honitsu, why: 3 色を使うので、1 色にはならない}
    - {key: chinitsu, why: 3 色を使うので、1 色にはならない}
    - {key: chiitoitsu, why: 七対子に刻子は無い}
  tips:
    - 狙って作る役ではない。同じ数字の対子が 3 色にあるときにだけ、見えてくる。
    - 対々和や三暗刻を作っている途中で、数字がそろったら付く、くらいに考えておく。
  practice: sanshoku_doukou
  practice_note: 一人練習は鳴けないので、刻子が 4 つそろうと四暗刻（役満）になり、三色同刻は数えない。役を指定した練習では、4 つめの面子を順子にする形を狙う。

- key: ittsu
  group: han2
  short: 同じ色で 123・456・789 の順子を 3 つ作る（1 から 9 までを 1 色でつなぐ）。
  definition:
    - 同じ色の数牌で、123・456・789 の 3 つの順子がある
    - 門前なら 2 翻、鳴くと 1 翻（喰い下がり）
  notes:
    - 残りの 1 面子と雀頭は、何でもよい。
    - 1〜9 が 1 枚ずつあるだけでは足りない。「123・456・789」の 3 組に分けられることが条件。
  kanji: 一気に（1 から 9 まで）通し貫く。卓では「イッツー」（一通）と略す。
  origin:
    text: >-
      戦前の日本の麻雀で、すでに 1 翻の役だった。中国語では「一條龍」「清龍」と呼ぶ。
      「一気通貫」という名前を、誰がいつ付けたのかを示す資料は、見つかっていない。
    certainty: 不明
  examples:
    - title: 門前の一気通貫（嵌張待ち）
      hand: "123456789m24s44z"
      win: "3s"
      note: 萬子で 123・456・789。役は一気通貫だけで 2 翻。
    - title: 鳴いた一気通貫（1 翻）
      hand: "456789p24s44z"
      win: "3s"
      melds: ["chi 123p"]
      note: 鳴くと 1 翻に下がる。
    - title: 混一色・一気通貫
      hand: "123456m78m333z44z"
      win: "9m"
      note: 1 色に寄せた手は、一気通貫ができやすい。門前の混一色 3 翻と合わせて 5 翻（満貫）。
  traps:
    - title: 安目であがった
      hand: "23456789m234s44z"
      win: "4m"
      expect: win
      why: 1萬 なら 123・456・789 がそろう。4萬 では 234・456・789 になり、123 ができない（この手は平和だけになる）。
    - title: 2 色にまたがっている
      hand: "123m456p789m24s44z"
      win: "3s"
      expect: no_yaku
      why: 456 だけが筒子。1〜9 を同じ色でそろえなければならない。役がないので、あがれない。
    - title: 1〜9 はそろっているが、分け方が違う
      hand: "123345678m99m23s"
      win: "4s"
      expect: win
      why: 萬子の 1〜9 は全部あるが、順子に分けると 123・345・678 と雀頭の 99。123・456・789 の 3 組にならない（この手は平和であがれる）。
  good:
    - {key: pinfu, why: どちらも順子の役}
    - {key: honitsu, why: 1 色に寄せると、123・456・789 がそろいやすい}
    - {key: chinitsu, why: 1 色だけの手は、一気通貫ができやすい}
    - {key: riichi, why: 門前で作れば、リーチと合わせやすい}
  never:
    - {key: tanyao, why: 1 と 9 を使う}
    - {key: sanshoku, why: 順子 3 つを 1 色で使うので、3 色にそろえる面子が足りない}
    - {key: toitoi, why: 対々和は刻子だけ}
    - {key: sanankou, why: 順子 3 つと暗刻 3 つは、同時に作れない}
    - {key: chanta, why: 456 の順子に、1・9・字牌が入らない}
    - {key: junchan, why: 456 の順子に、1・9 が入らない}
    - {key: chiitoitsu, why: 七対子に順子は無い}
  tips:
    - 1 色の数牌が多く、123・456・789 のうち 2 組ができていたら、残りの 1 組を意識する。
    - 「あと 1 枚」の待ちが、嵌張や辺張になりやすい。両面待ちのときは、片方が安目になることが多い。
    - 鳴いても 1 翻付くが、鳴くとほかの門前の役が消える。役牌や混一色と合わせられるときに鳴く。
  practice: ittsu

- key: chanta
  group: han2
  short: 4 つの面子と雀頭のすべてに、1・9・字牌のどれかを入れる。
  definition:
    - 4 つの面子と雀頭のすべてに、么九牌（1・9・字牌）が入っている
    - 順子が 1 つ以上ある（使える順子は 123 と 789 だけ）
    - 字牌が入っている
    - 門前なら 2 翻、鳴くと 1 翻（喰い下がり）
  notes:
    - 字牌が 1 枚もなければ、純全帯么九（3 翻）になる。
    - 順子が 1 つもなければ、混老頭（2 翻）になる。
    - 待ちが辺張・嵌張になりやすい。両面待ちのときは、片方が安目になる。
  kanji: 混＝字牌まじり／全＝すべて（の面子と雀頭）／帯＝帯びる（含む）／么九＝ 1 と 9。卓では「チャンタ」と略す。
  origin:
    text: >-
      もとは、字牌があるかないかを区別しない「全帯么九」という役だった。
      戦後の日本で、字牌のない形（純全帯么九）を別の役として分けたので、区別のために「混」を付けた。
    certainty: 有力
  examples:
    - title: 門前のチャンタ（辺張待ち）
      hand: "123m789m123p89s44z"
      win: "7s"
      note: 面子は 123・789・123・789、雀頭は北。すべてに 1・9・字牌が入っている。
    - title: 鳴いたチャンタ（1 翻）＋役牌
      hand: "123m99s12s"
      win: "3s"
      melds: ["pon 555z", "chi 789p"]
      note: 鳴くと 1 翻に下がるが、役牌と合わせて 2 翻。
  traps:
    - title: 安目であがった
      hand: "123m789m123p78s44z"
      win: "6s"
      expect: win
      why: 9索 なら 789 でチャンタ。6索 では 678索 になり、1・9・字牌のない面子ができる（この手は平和だけになる）。
    - title: 字牌が 1 枚もない
      hand: "123m789m123p7899s"
      win: "9s"
      expect: win
      why: 字牌がないので、上位の純全帯么九（3 翻）になる。2 つを同時には数えない。
    - title: 順子が 1 つもない
      hand: "111s11z99s"
      win: "1z"
      melds: ["pon 111m", "pon 999p"]
      expect: win
      why: すべて刻子なので、混全帯么九ではなく、混老頭と対々和になる。
  good:
    - {key: yakuhai, why: 字牌の刻子は、チャンタの面子になる}
    - {key: sanshoku, why: 123 か 789 の三色なら、両方付く}
    - {key: honitsu, why: 1 色の 123・789 と字牌で作れば、両方付く}
  never:
    - {key: tanyao, why: 断么九は 1・9・字牌を使わない}
    - {key: ittsu, why: 456 の順子に、1・9・字牌が入らない}
    - {key: junchan, why: 字牌がなければ、上位の純全帯么九だけを数える}
    - {key: honroutou, why: 順子がなければ、混老頭になる}
    - {key: toitoi, why: チャンタには順子が要る}
    - {key: chinitsu, why: チャンタには字牌が要る}
    - {key: chiitoitsu, why: 七対子は別の形}
  tips:
    - 配牌に 1・9・字牌が多く、4〜6 の牌が少ないときに向く。
    - 役牌をポンできれば、鳴いても「役牌＋チャンタ」で 2 翻になる。
    - 4・5・6 の牌を使えないので、手が進みにくい。遅くなりそうなら、無理に狙わない。
  practice: chanta

- key: sankantsu
  group: han2
  short: 1 人で 3 回カンをして、槓子を 3 つ作る。
  definition:
    - 槓子が 3 つある
    - 暗槓・大明槓・加槓の、どれでもよい。鳴いても 2 翻
  notes:
    - 4 つ目のカンもして、4 つとも槓子にすると、役満の四槓子になる。
    - 同じ牌を 4 枚持っているだけでは、槓子ではない。カンを宣言して、卓にさらしたものだけを数える。
    - 2 人以上のカンが合わせて 4 回になると、その局を流局にするルールがある（ルールによって異なる）。
  kanji: 三つの槓子。槓子＝カンを宣言した、同じ牌 4 枚の組。
  origin:
    text: 1924 年に天津で出た日本語の本に、「三槓子」として載っている。
    certainty: 有力
  examples:
    - title: 三槓子のみ
      hand: "34s99m"
      win: "5s"
      melds: ["minkan 2222m", "ankan 6666p", "kakan 7777s"]
      note: カンの種類は問わない。槓子は符が大きいので、2 翻でも 60 符になる。
    - title: 三槓子・役牌
      hand: "45m77s"
      win: "6m"
      melds: ["ankan 1111z", "minkan 9999p", "minkan 3333s"]
      note: 場風の東の槓子があるので 3 翻。符が 80 符あるので、満貫になる。
  traps:
    - title: 槓子 2 つと、暗刻 1 つ
      hand: "777s34s99m"
      win: "5s"
      melds: ["minkan 2222m", "ankan 6666p"]
      expect: no_yaku
      why: 777索 は刻子（3 枚）。4 枚目を引いてカンを宣言しなければ、槓子にならない。ほかに役がないので、あがれない。
    - title: 同じ牌を 4 枚持っているが、カンを宣言していない
      hand: "7777s89s9m"
      win: "9m"
      melds: ["minkan 2222m", "ankan 6666p"]
      expect: no_yaku
      why: 7索 の 4 枚は、777索 の刻子と 789索 の順子に使っている。カンを宣言していないので、槓子は 2 つだけ。
  good:
    - {key: toitoi, why: 残りの 1 面子も刻子なら、両方付く}
    - {key: sanankou, why: 3 つとも暗槓なら、両方付く}
    - {key: yakuhai, why: 役牌の槓子は、役牌としても数える}
    - {key: rinshan, why: カンをして引いた牌であがれば付く}
  never:
    - {key: pinfu, why: 平和は順子だけ}
    - {key: chiitoitsu, why: 七対子は別の形}
    - {key: sanshoku, why: 三色同順には順子が 3 つ要る}
    - {key: ittsu, why: 一気通貫には順子が 3 つ要る}
  tips:
    - 狙って作る役ではない。カンを 2 回したあと、3 回目ができそうなときにだけ見える。
    - カンをするたびにドラ（槓ドラ）が増え、相手の点も高くなる。
  practice_note: カンが要る役。一人練習ではカンができない（今後の版の、CPU との対局で使えるようにする予定）。
  solo: false

- key: shousangen
  group: han2
  short: 三元牌（白・發・中）のうち、2 種類を刻子に、残りの 1 種類を雀頭にする。
  definition:
    - 三元牌のうち、2 種類が刻子（または槓子）
    - 残りの 1 種類が雀頭
    - 鳴いて作ってもよい（2 翻のまま）
  notes:
    - 三元牌の刻子 2 つは、それぞれ役牌（1 翻ずつ）でもある。小三元は、いつも 2 ＋ 1 ＋ 1 ＝ 4 翻以上になる。
    - 3 種類とも刻子にすると、役満の大三元。
  kanji: 三元＝三元牌（白・發・中）／小＝ 1 種類が雀頭どまり。
  origin:
    text: >-
      1920 年代の英語の本に、中国のルールの役として載っていて、日本に麻雀が伝わったころには、大三元とともにすでにあった。
      いちばん古い時期のルールには無く、大三元より後にできた役とみる説明もある。
      「三元」という言葉の由来は、科挙（昔の中国の役人の試験）の首席の称号から来たという説など、
      いくつかの説があって、はっきりしない。
    certainty: 諸説あり
  examples:
    - title: 2 つポンした小三元
      hand: "77z234m56p"
      win: "7p"
      melds: ["pon 555z", "pon 666z"]
      note: 小三元 2 翻＋白 1 翻＋發 1 翻＝ 4 翻。
    - title: 門前の小三元
      hand: "555z666z77z234m56p"
      win: "4p"
      note: 同じ 4 翻でも、暗刻は符が大きい。50 符になるので、満貫。
  traps:
    - title: 三元牌の刻子が 2 つ、雀頭はほかの牌
      hand: "99m234m56p"
      win: "7p"
      melds: ["pon 555z", "pon 666z"]
      expect: win
      why: 3 種類目の中が 1 枚もない。雀頭が三元牌でなければ、小三元にならない（役牌 2 つの 2 翻）。
    - title: 三元牌の刻子が 1 つ、雀頭が 1 つ
      hand: "66z234m567p78s"
      win: "9s"
      melds: ["pon 555z"]
      expect: win
      why: 刻子は白だけで、發は雀頭。3 種類のうち、2 種類が刻子、1 種類が雀頭のときだけ小三元（この手は役牌の 1 翻）。
    - title: 3 種類とも刻子
      hand: "777z234m9p"
      win: "9p"
      melds: ["pon 555z", "pon 666z"]
      expect: win
      why: 3 種類とも刻子なら、役満の大三元になる。
  good:
    - {key: yakuhai, why: 三元牌の刻子 2 つが、必ず役牌として付く}
    - {key: honitsu, why: 残りを 1 色でまとめれば、両方付く}
    - {key: toitoi, why: 残りも刻子なら、両方付く}
    - {key: chanta, why: 残りを 123・789 で作れば、両方付く}
  never:
    - {key: pinfu, why: 刻子があり、雀頭も役牌}
    - {key: tanyao, why: 三元牌は字牌}
    - {key: chiitoitsu, why: 七対子に刻子は無い}
    - {key: junchan, why: 純全帯么九は字牌を使えない}
    - {key: chinitsu, why: 清一色は字牌を使えない}
    - {key: daisangen, why: 3 種類とも刻子なら、大三元だけを数える}
  tips:
    - 三元牌の対子が 2 種類あって、残りの 1 種類も持っているときに狙える。
    - 三元牌を 2 種類ポンすると、ほかの人は大三元を警戒して、3 種類目を捨てなくなる。3 種類目は雀頭で十分、と考える。
  practice: shousangen
  practice_note: 一人練習は鳴けないので、刻子が 4 つそろうと四暗刻（役満）になり、小三元は数えない。役を指定した練習では、残りの面子に順子を入れる形を狙う。

- key: honroutou
  group: han2
  short: 手牌のすべてを、1・9・字牌だけで作る。
  definition:
    - 手牌 14 枚が、すべて么九牌（1・9・字牌）
    - 順子は作れないので、形は「刻子 4 つ＋雀頭」か「七対子」になる
    - 鳴いて作ってもよい（2 翻のまま）
  notes:
    - 必ず対々和（2 翻）か七対子（2 翻）と一緒に付く。混老頭は、いつも 4 翻以上になる。
    - 字牌が 1 枚もなければ清老頭（役満）、数牌が 1 枚もなければ字一色（役満）。
  kanji: 混＝字牌まじり／老頭＝数牌の 1 と 9。卓では「ホンロー」と略す。
  origin:
    text: >-
      中国由来。1923 年にアメリカで出たルールブックが、「1・9・字牌だけの手」を、
      中国各地で通用する最高点の役として挙げている。日本での翻数は、時代とルールによって 1 翻から 3 翻までまちまちだった。
      いまは 2 翻がふつう。
    certainty: 確実
  examples:
    - title: 混老頭・対々和
      hand: "999s33z44z"
      win: "3z"
      melds: ["pon 999m", "pon 111p"]
      note: 混老頭 2 翻＋対々和 2 翻＝ 4 翻。1・9・字牌の刻子は符も大きく、40 符で満貫。
    - title: 混老頭・七対子
      hand: "1199m1199p1199s1z"
      win: "1z"
      note: 1・9・字牌の対子が 7 組。4 翻 25 符で 6400 点。
  traps:
    - title: 順子がある
      hand: "123s33z44z"
      win: "3z"
      melds: ["pon 999m", "pon 111p"]
      expect: win
      why: 123索 に 2 と 3 が入っている。手牌すべてが 1・9・字牌でなければならない（この手は混全帯么九）。
    - title: 字牌が 1 枚もない
      hand: "999s11s99p"
      win: "1s"
      melds: ["pon 999m", "pon 111p"]
      expect: win
      why: 字牌がなく、1 と 9 だけなら、役満の清老頭になる。
  good:
    - {key: toitoi, why: 刻子 4 つの形なら、必ず一緒に付く}
    - {key: chiitoitsu, why: 対子 7 組の形なら、必ず一緒に付く}
    - {key: yakuhai, why: 役牌の刻子があれば付く}
    - {key: honitsu, why: 数牌が 1 色だけなら、両方付く}
  never:
    - {key: tanyao, why: 断么九は 1・9・字牌を使わない}
    - {key: pinfu, why: 順子が作れない}
    - {key: chanta, why: 混全帯么九には順子が要る}
    - {key: junchan, why: 純全帯么九には順子が要る}
    - {key: sanshoku, why: 順子が作れない}
    - {key: ittsu, why: 順子が作れない}
    - {key: chinitsu, why: 1 色の 1 と 9 だけでは、14 枚にならない}
  tips:
    - 狙って作る役ではない。1・9・字牌の対子が多い配牌で、対々和や七対子を進めるうちに付く。
    - 1・9・字牌はほかの人が早めに捨てるので、序盤ならポンしやすい。
  practice: honroutou
  practice_note: 一人練習は鳴けないので、刻子 4 つの形でツモると四暗刻（役満）になり、混老頭は数えない。役を指定した練習では、七対子の形（1・9・字牌の対子を 7 組）を狙う。ポンして作る形は、今後の版の、鳴きのある対局で練習できるようにする予定。

# ============================================================ 3 翻

- key: ryanpeikou
  group: han3
  short: 「同じ色・同じ数字の順子 2 組」を 2 つ作る（一盃口が 2 つ）。門前限定。
  definition:
    - 門前である
    - 「同じ色で、同じ数字の並びの順子 2 組」が 2 つある（4 つの面子をすべて使う）
  notes:
    - 一盃口が 2 つできた形。二盃口が付くとき、一盃口は数えない。
    - 対子 7 組にも見えるが、七対子（2 翻）とは複合しない。点の高い二盃口で数える。
  kanji: 二（両）＝ 2 つ／盃口＝一盃口 →「一盃口が 2 つ」。「二」をリャンと読むのは、「両」の音。
  origin:
    text: 日本生まれ（戦後）。一盃口が 2 つできた形を別に数えるようになり、のちに 3 翻になった。中国の麻雀には、これに当たる役の名前がない。
    certainty: 有力
  examples:
    - title: 二盃口のみ
      hand: "112233m778899p5s"
      win: "5s"
      note: 123萬 が 2 組、789筒 が 2 組。雀頭の単騎待ち。
    - title: リーチ・平和・断么九・二盃口
      hand: "223344m66778p55s"
      win: "8p"
      riichi: true
      note: 2〜8 の順子で作って両面待ちなら、平和と断么九も付く。6 翻で跳満。
  traps:
    - title: 鳴いた手
      hand: "234m556677p8s"
      win: "8s"
      melds: ["chi 234m"]
      expect: win
      why: 門前限定。鳴くと、二盃口も一盃口も付かない（この手は断么九であがれる）。
    - title: 片方が 1 つずれている
      hand: "223344m567p67p88s"
      win: "8p"
      expect: win
      why: 筒子は 567 と 678 で、同じ順子ではない。同じ順子 2 組は萬子だけなので、一盃口（1 翻）になる。
  good:
    - {key: riichi, why: どちらも門前の役}
    - {key: pinfu, why: どちらも順子の役}
    - {key: tanyao, why: 2〜8 の順子で作れば、両方付く}
    - {key: menzen_tsumo, why: 門前なので、ツモれば付く}
  never:
    - {key: iipeikou, why: 上位の二盃口だけを数える}
    - {key: chiitoitsu, why: 両方に読める手は、高い方の二盃口で数える}
    - {key: toitoi, why: 対々和は刻子だけ}
    - {key: sanankou, why: 二盃口は順子 4 つ}
    - {key: sanshoku, why: 4 つの面子を 2 色までで使う}
    - {key: ittsu, why: 同じ順子が 2 組ずつ要るので、123・456・789 を作る面子が足りない}
  tips:
    - 狙って作るのは難しい。一盃口ができていて、残りも「対子が並んだ形」（5566 など）のときに見える。
    - 七対子の一向聴から、二盃口に変わることがある。同じ牌の並びでも、点が 2 倍以上違う。
  practice: ryanpeikou

- key: honitsu
  group: han3
  short: 数牌を 1 色だけにして、字牌と組み合わせる。
  definition:
    - 数牌は 1 色だけ（萬子・筒子・索子のどれか 1 種類）
    - 字牌が入っている
    - 門前なら 3 翻、鳴くと 2 翻（喰い下がり）
  notes:
    - 字牌が 1 枚もなければ清一色（6 翻）、数牌が 1 枚もなければ字一色（役満）。
    - 七対子の形でも成立する。
  kanji: 混＝字牌まじり／一色＝数牌が 1 種類。卓では「ホンイツ」と略す。
  origin:
    text: 麻雀のいちばん古い時期からある役。1920 年代のルールブックにも、点が倍になる役として載っている。
    certainty: 確実
  examples:
    - title: 鳴いた混一色（2 翻）＋役牌
      hand: "456m78m33z"
      win: "9m"
      melds: ["pon 555z", "chi 234m"]
      note: 萬子と字牌だけ。混一色 2 翻＋白 1 翻＝ 3 翻。
    - title: 門前の混一色（3 翻）
      hand: "234567m78m333z22z"
      win: "9m"
      note: 門前なら 3 翻。リーチをかけていなくてもロンできる。
  traps:
    - title: 1 組だけ別の色
      hand: "456m78p33z"
      win: "9p"
      melds: ["pon 555z", "chi 234m"]
      expect: win
      why: 789筒 が別の色。数牌は 1 色だけでなければならない（この手は役牌の白であがれる）。
    - title: 字牌が 1 枚もない
      hand: "456m78m111m33m"
      win: "9m"
      melds: ["chi 234m"]
      expect: win
      why: 字牌がなく、萬子だけなら、上位の清一色になる（鳴いて 5 翻）。
  good:
    - {key: yakuhai, why: 字牌を使う役どうし。鳴いても 3 翻になる}
    - {key: toitoi, why: 1 色と字牌の刻子で作れば、両方付く}
    - {key: ittsu, why: 1 色に寄せると、123・456・789 がそろいやすい}
    - {key: chanta, why: 1 色の 123・789 と字牌で作れば、両方付く}
    - {key: chiitoitsu, why: 1 色と字牌の対子 7 組でも成立する}
  never:
    - {key: tanyao, why: 字牌を使う}
    - {key: sanshoku, why: 数牌が 1 色だけ}
    - {key: sanshoku_doukou, why: 数牌が 1 色だけ}
    - {key: junchan, why: 純全帯么九は字牌を使えない}
    - {key: chinitsu, why: 字牌がなければ、清一色だけを数える}
  tips:
    - 配牌で 1 色の数牌が 7〜8 枚以上あって、字牌の対子もあるときに向く。
    - 役牌と合わせると、鳴いても 3 翻。字牌はほかの人が早めに捨てるので、ポンしやすい。
    - 捨て牌が 2 色に偏るので、ほかの人に気づかれやすい。気づかれると、その色と字牌が出てこなくなる。
  practice: honitsu

- key: junchan
  group: han3
  short: 4 つの面子と雀頭のすべてに、数牌の 1 か 9 を入れる。字牌は使わない。
  definition:
    - 4 つの面子と雀頭のすべてに、老頭牌（数牌の 1 か 9）が入っている
    - 字牌を 1 枚も使わない
    - 順子が 1 つ以上ある（使える順子は 123 と 789 だけ）
    - 門前なら 3 翻、鳴くと 2 翻（喰い下がり）
  notes:
    - 字牌が入ると、混全帯么九（2 翻）になる。
    - 順子が 1 つもなく、すべて 1・9 の刻子なら、役満の清老頭。
    - 待ちが辺張・嵌張になりやすい。両面待ちのときは、片方が安目になる。
  kanji: 純＝純粋な（字牌のない）／全帯么九＝すべてに 1・9 が含まれる。卓では「ジュンチャン」と略す。
  origin:
    text: 日本生まれ。戦後のリーチ麻雀で、字牌のない形を別の役として分けた。中国の麻雀は、混全帯么九と区別しない。
    certainty: 有力
  examples:
    - title: 門前の純チャン（辺張待ち）
      hand: "123m789m123p89s11s"
      win: "7s"
      note: 面子は 123・789・123・789、雀頭は 1索。すべてに 1 か 9 が入っている。
    - title: 鳴いた純チャン（2 翻）
      hand: "123m99m78s"
      win: "9s"
      melds: ["chi 789p", "pon 111s"]
      note: 鳴くと 2 翻に下がる。
    - title: 純チャン・三色同順・平和（高目）
      hand: "123m123p23s789m99p"
      win: "1s"
      note: 1索 なら 6 翻で跳満（12000 点）。4索 でもあがれるが、平和だけの 1000 点になる。同じ聴牌で 12 倍の差。
  traps:
    - title: 雀頭が字牌
      hand: "123m789m123p89s44z"
      win: "7s"
      expect: win
      why: 雀頭の北は字牌。字牌が 1 枚でも入ると、純全帯么九ではなく、混全帯么九（2 翻）になる。
    - title: 安目であがった
      hand: "123m789m123p7899s"
      win: "6s"
      expect: win
      why: 9索 なら 789 で純チャン。6索 では 678索 になり、1・9 のない面子ができる（この手は平和だけになる）。
  good:
    - {key: sanshoku, why: 123 か 789 の三色なら、両方付く}
    - {key: pinfu, why: 順子だけで作って両面待ちなら、両方付く}
    - {key: iipeikou, why: 123 や 789 が 2 組あれば、両方付く}
    - {key: riichi, why: 門前で作れば、リーチと合わせやすい}
  never:
    - {key: tanyao, why: 断么九は 1・9 を使わない}
    - {key: yakuhai, why: 字牌を使えない}
    - {key: ittsu, why: 456 の順子に、1・9 が入らない}
    - {key: chanta, why: 字牌がなければ、上位の純全帯么九だけを数える}
    - {key: honitsu, why: 混一色には字牌が要る}
    - {key: toitoi, why: 純全帯么九には順子が要る}
    - {key: chiitoitsu, why: 七対子は別の形}
  tips:
    - 123 と 789 の形が多く、字牌が少ないときに向く。
    - 三色同順（123 か 789）と一緒にできやすい。
    - 4・5・6 の牌を使えないので、時間がかかる。無理に狙わず、できそうなときだけ。
  practice: junchan

# ============================================================ 6 翻

- key: chinitsu
  group: han6
  short: 手牌のすべてを、1 色の数牌だけで作る。字牌も使わない。
  definition:
    - 手牌 14 枚が、すべて同じ色の数牌（萬子だけ、筒子だけ、索子だけ）
    - 字牌を 1 枚も使わない
    - 門前なら 6 翻、鳴くと 5 翻（喰い下がり）
  notes:
    - これだけで、門前なら跳満、鳴いても満貫になる。
    - 同じ色の牌が多いと、待ちが 3 種類以上になることが多く、読みまちがえやすい。聴牌したら、あがれる牌をゆっくり確かめる。
    - 七対子の形でも成立する。
  kanji: 清＝まじりけがない（字牌なし）／一色＝数牌が 1 種類。卓では「チンイツ」と略す。
  origin:
    text: 麻雀のいちばん古い時期からある役。1920 年代のルールブックでも、混一色より高い役として載っている。
    certainty: 確実
  examples:
    - title: 門前の清一色
      hand: "111345567m7899m"
      win: "9m"
      note: 萬子だけ。清一色の 6 翻だけで跳満（12000 点）。
    - title: 鳴いた清一色（5 翻）
      hand: "345s66s78s"
      win: "6s"
      melds: ["pon 999s", "chi 123s"]
      note: 鳴いても 5 翻で、満貫（8000 点）。
    - title: 清一色・一気通貫・平和
      hand: "1234567892355m"
      win: "4m"
      note: 1 色だけの手は、一気通貫や平和が重なりやすい。6 ＋ 2 ＋ 1 ＝ 9 翻で倍満。
  traps:
    - title: 雀頭が字牌
      hand: "111234567m88m33z"
      win: "8m"
      expect: win
      why: 雀頭の西が字牌。字牌が 1 枚でも入ると、清一色ではなく、混一色（3 翻）になる。
    - title: 1 組だけ別の色
      hand: "345s66s78p"
      win: "9p"
      melds: ["pon 999s", "chi 123s"]
      expect: no_yaku
      why: 789筒 が別の色。鳴いていてほかに役がないので、あがれない。
  good:
    - {key: ittsu, why: 1 色だけなので、123・456・789 がそろいやすい}
    - {key: pinfu, why: 門前で順子だけなら付く}
    - {key: iipeikou, why: 同じ色の牌が多いので、同じ順子ができやすい}
    - {key: tanyao, why: 2〜8 だけで作れば、両方付く}
  never:
    - {key: yakuhai, why: 字牌を使えない}
    - {key: honitsu, why: 上位の清一色だけを数える}
    - {key: chanta, why: 混全帯么九には字牌が要る}
    - {key: sanshoku, why: 数牌が 1 色だけ}
    - {key: sanshoku_doukou, why: 数牌が 1 色だけ}
    - {key: honroutou, why: 1 色の 1 と 9 だけでは、14 枚にならない}
    - {key: shousangen, why: 字牌を使えない}
  tips:
    - 配牌で 1 色が 9〜10 枚以上あるときに狙える。
    - 途中までは混一色と同じ進め方。字牌が重ならなければ、字牌も切って清一色へ。
    - 待ちが複雑で分からなくなったら、分かる形になるように 1 枚切るのも手。
  practice: chinitsu

# ============================================================ 役満

- key: tenhou
  group: yakuman
  short: 親が、配られた 14 枚でもうあがっている。
  definition:
    - 親である
    - 配牌の 14 枚が、そのままあがりの形になっている
    - 何も捨てず、カンもせずに、あがりを宣言する
  notes:
    - 形は何でもよい（4 面子 1 雀頭、七対子、国士無双）。ほかに役がなくてもよい。
    - 配牌が国士無双や四暗刻の形なら、役満どうしが重なる（重なった役満をどう数えるかは、ルールによって異なる）。
  kanji: 天＝天から（与えられた）／和＝あがり。
  origin:
    text: 中国から伝わった、最高点の役。1923 年にアメリカで出たルールブックに、「中国人は『天からの手』と呼ぶ」と書かれている。
    certainty: 確実
  examples:
    - title: 天和
      hand: "123m456p789s34s22p"
      win: "5s"
      seat: 東
      is_tsumo: true
      tenhou: true
      note: 親の配牌 14 枚が、あがりの形。平和の形だが、役満なので、ふつうの役は数えない。親の役満は 48000 点。
    - title: 天和（七対子の形）
      hand: "1199m3355p2288s7z"
      win: "7z"
      seat: 東
      is_tsumo: true
      tenhou: true
      note: 七対子の形でも天和。
  traps:
    - title: 親が 1 枚捨てたあと、次のツモであがった
      hand: "123m456p789s34s22p"
      win: "5s"
      seat: 東
      is_tsumo: true
      expect: win
      why: 配牌の 14 枚であがっているときだけが天和。1 枚でも捨てたら、ふつうのツモあがり（門前清自摸和・平和）。
    - title: 子が、最初のツモであがった
      hand: "123m456p789s34s22p"
      win: "5s"
      is_tsumo: true
      chiihou: true
      expect: win
      why: 子の最初のツモあがりは、天和ではなく地和（これも役満）。
    - title: 親が、配牌で暗槓をしてからあがった
      hand: "123m456p78s22p"
      win: "9s"
      melds: ["ankan 1111z"]
      seat: 東
      is_tsumo: true
      rinshan: true
      expect: win
      why: カンをすると、配牌そのままのあがりではなくなる。天和にならず、嶺上開花などのふつうの役で数える。
  combo_note: 手の形に関係なく成立する。役満なので、ふつうの役（平和など）は数えない。
  never:
    - {key: riichi, why: 配牌であがっているので、宣言する機会がない}
    - {key: double_riichi, why: 配牌であがっているので、宣言する機会がない}
    - {key: chiihou, why: 天和は親、地和は子}
    - {key: rinshan, why: カンをすると天和にならない}
  tips:
    - 狙って作ることはできない。出典の統計では、約 151 万回のあがりのうち 6 回。
    - 配牌を取ったら、理牌（並べ替え）の前に捨てない。親は、まず 14 枚があがりの形になっていないかを見る。
  practice_note: 狙う方法がないので、役を指定した練習は無い。一人練習で、親の最初のツモがあがりなら成立する。

- key: chiihou
  group: yakuman
  short: 子が、配牌で聴牌していて、最初のツモであがる。
  definition:
    - 子である
    - 配牌の 13 枚で聴牌していて、自分の最初のツモであがる
    - それより前に、誰もチー・ポン・カンをしていない
  notes:
    - 形は何でもよい。ほかに役がなくてもよい。
    - ほかの人の最初の捨て牌でロンすることを「人和」という役にするルールもあるが、採用しないルールが多い（ルールによって異なる。このアプリでは役にしない）。
  kanji: 地＝（天に対する）地／和＝あがり。
  origin:
    text: >-
      もとは「親の最初の捨て牌でロンする」役だった（1914 年に上海で出た本など）。
      日本では、日本麻雀連盟が昭和 9 年（1934 年）に「子の最初のツモあがり」と決め直したとされる。
      ただし、地和と人和の決め方は、戦後しばらくまで、資料によってまちまちだった。
    certainty: 有力
  examples:
    - title: 地和
      hand: "123m456p789s34s22p"
      win: "5s"
      is_tsumo: true
      chiihou: true
      note: 子の最初のツモであがり。子の役満は 32000 点。
    - title: 地和（役のない形）
      hand: "123m456p789s13s44z"
      win: "2s"
      is_tsumo: true
      chiihou: true
      note: 嵌張待ちで、ほかに役がない形でもよい。
  traps:
    - title: 最初のツモの前に、ほかの人がポンをした
      hand: "123m456p789s13s44z"
      win: "2s"
      is_tsumo: true
      expect: win
      why: 自分の最初のツモより前に、誰かの鳴きが入ると、地和にならない。ふつうのツモあがり（門前清自摸和）になる。
    - title: ほかの人の最初の捨て牌でロン
      hand: "123m456p789s13s44z"
      win: "2s"
      expect: no_yaku
      why: 地和はツモあがりだけ。最初の巡目のロン（人和）を役にするルールもあるが、このアプリのルールでは役にならない。役がないので、あがれない。
  combo_note: 手の形に関係なく成立する。役満なので、ふつうの役は数えない。
  never:
    - {key: riichi, why: 最初のツモであがるので、宣言する機会がない}
    - {key: double_riichi, why: 最初のツモであがるので、宣言する機会がない}
    - {key: tenhou, why: 天和は親、地和は子}
  tips:
    - 狙って作ることはできない。出典の統計では、約 151 万回のあがりのうち 15 回。
    - 配牌で聴牌していたら、ダブル立直を宣言する前に、最初のツモがあがり牌でないかを確かめる。
  practice_note: 狙う方法がないので、役を指定した練習は無い。一人練習で、子の最初のツモがあがりなら成立する。

- key: kokushi
  yaku: [kokushi, kokushi_13]
  group: yakuman
  short: 13 種類の么九牌（1・9・字牌）を 1 枚ずつ集め、そのどれか 1 種類をもう 1 枚持つ。
  definition:
    - 門前である
    - 13 種類の么九牌（1萬・9萬・1筒・9筒・1索・9索・東・南・西・北・白・發・中）が、1 枚ずつそろっている
    - そのうちのどれか 1 種類を、もう 1 枚持っている（雀頭の代わり）
  notes:
    - 13 種類が 1 枚ずつそろって聴牌すると、13 種類のどれでもあがれる（十三面待ち）。これをダブル役満にするルールがある（雀魂など。ルールによって異なる）。
    - 国士無双だけは、ほかの人の暗槓の牌でもロンできる、とするルールがある（雀魂は認める。天鳳や Mリーグは認めない。ルールによって異なる）。
    - 同じ么九牌が 4 枚とも見えたら（捨て牌や鳴き）、その種類はもう手に入らない。国士無双は作れなくなる。
  kanji: 国士＝国でいちばん優れた人／無双＝並ぶ者がいない。中国の歴史書『史記』で、韓信という武将をほめた言葉。
  origin:
    text: >-
      役そのものは古い。名前については、
      「正式な名前は十三么九（シーサンヤオチュー）で、国士無双は呼び名のひとつ」という説明が広く知られている。
      一方で、1914 年に上海で出た本にすでに「國士無雙」とあり、
      十三么九の方が後の資料に出てくる、という指摘もある。
    certainty: 諸説あり
  examples:
    - title: 国士無双
      hand: "119m19p19s123456z"
      win: "7z"
      note: 1萬 が 2 枚あり、足りないのは中だけ。中を待つ形。
    - title: 国士無双十三面待ち
      hand: "19m19p19s1234567z"
      win: "9s"
      note: 13 種類が 1 枚ずつ。13 種類のどれが来てもあがり。雀魂のルールではダブル役満。
  traps:
    - title: 1 種類足りない
      hand: "119m19p19s123456z"
      win: "1m"
      expect: not_winning
      why: 中が 1 枚もない。13 種類すべてがそろって、はじめてあがり。
    - title: 么九牌ばかりだが、7 種類しかない
      hand: "1199m1199p1199s1z"
      win: "1z"
      expect: win
      why: 么九牌だけでも、13 種類が 1 枚ずつそろっていなければ、国士無双ではない。この手は、七対子と混老頭。
  combo_note: 形が決まっているので、ほかの形の役とは複合しない。天和・地和とは重なる。
  tips:
    - 配牌に么九牌が 9 種類以上あるときに狙える。
    - 2〜8 の牌ばかりを捨てることになるので、ほかの人に気づかれやすい。
    - 欲しい牌の 4 枚目が見えたら、あきらめて守る。
  practice: kokushi

- key: suuankou
  yaku: [suuankou, suuankou_tanki]
  group: yakuman
  short: 暗刻（自分で 3 枚そろえた刻子）を 4 つ作る。
  definition:
    - 門前である（暗槓はしていてもよい）
    - 暗刻（暗槓を含む）が 4 つある
    - 双碰待ち（対子 2 組のどちらかを待つ形）のときは、ツモあがりに限る。ロンだと、その 1 組が明刻になる
    - 単騎待ち（雀頭を待つ形）なら、ロンでもよい。暗刻が、もう 4 つできているため
  notes:
    - 単騎待ちの四暗刻（四暗刻単騎）を、ダブル役満にするルールがある（雀魂など。ルールによって異なる）。
    - 役満の中では、いちばんよく出る。
  kanji: 四つの暗刻。卓では「スーアンコー」。単騎待ちは「スッタン」と略すことがある。
  origin:
    text: 中国由来。1923 年にアメリカで出たルールブックが、「手の内の 3 枚組 4 つ」を、中国各地で通用する最高点の役として挙げている。
    certainty: 確実
  examples:
    - title: 四暗刻（双碰待ちをツモ）
      hand: "222m444p999s77s11z"
      win: "7s"
      is_tsumo: true
      note: 暗刻 3 つと対子 2 組。ツモったので、777索 も暗刻になる。
    - title: 四暗刻単騎
      hand: "111m333p555s777s2z"
      win: "2z"
      note: 暗刻が 4 つできていて、雀頭を待つ形。ロンでも役満。雀魂のルールではダブル役満。
  traps:
    - title: 双碰待ちをロン
      hand: "222m444p999s77s11z"
      win: "7s"
      expect: win
      why: ロンで完成した 777索 は、明刻として数える。暗刻は 3 つなので、三暗刻と対々和（満貫）になる。役満とは 4 倍の差。
    - title: 1 つポンしている
      hand: "222m444p77s11z"
      win: "7s"
      melds: ["pon 999s"]
      is_tsumo: true
      expect: win
      why: ポンした 999索 は明刻。四暗刻は、門前でしか作れない（この手は三暗刻と対々和）。
  combo_note: 役満なので、ふつうの役（対々和・三暗刻など）は数えない。字一色・大三元・清老頭など、刻子で作るほかの役満とは重なることがある。
  tips:
    - 対子が多い手で、ポンをせずに暗刻が 2〜3 つできたときに見えてくる。
    - 聴牌が双碰待ちなら、ロンだと三暗刻・対々和になる。それでも満貫以上あるので、ロンしてよい。
    - 暗刻が 3 つできたあとは、ポンをすると四暗刻が消える。鳴くかどうかを、点数の状況で決める。
  practice: suuankou

- key: daisangen
  group: yakuman
  short: 三元牌（白・發・中）の 3 種類すべてを、刻子にする。
  definition:
    - 白・發・中の 3 種類すべてが、刻子（または槓子）
    - 鳴いて作ってもよい
  notes:
    - 残りの 1 面子と雀頭は、何でもよい。
    - 責任払い（包・パオ）：三元牌を 2 種類鳴いている人に、3 種類目をポンさせた人が、ツモあがりの点を 1 人で払う、という決まりがある（ロンのときは、放銃した人と半分ずつ）。採用するかどうかは、ルールによって異なる。
  kanji: 三元＝三元牌（白・發・中）／大＝ 3 種類とも刻子。
  origin:
    text: >-
      麻雀のいちばん古い時期からある、最高点の役。「三元」という言葉の由来は、
      科挙（昔の中国の役人の試験）の首席の称号から来たという説など、いくつかの説があって、はっきりしない。
    certainty: 諸説あり
  examples:
    - title: 2 つポンした大三元
      hand: "777z234m9p"
      win: "9p"
      melds: ["pon 555z", "pon 666z"]
      note: 白と發をポンして、中は自分で 3 枚そろえた。
    - title: 門前の大三元（双碰待ち）
      hand: "555z666z77z234m99p"
      win: "7z"
      note: 中であがれば大三元。9筒 であがると小三元になる（下のひっかけ例）。
  traps:
    - title: 3 種類目が雀頭
      hand: "77z234m56p"
      win: "7p"
      melds: ["pon 555z", "pon 666z"]
      expect: win
      why: 中が 2 枚（雀頭）だけ。3 種類とも 3 枚そろえて大三元。この手は小三元（4 翻）。
    - title: 双碰待ちで、三元牌でない方であがった
      hand: "555z666z77z234m99p"
      win: "9p"
      expect: win
      why: 9筒 であがると、中は雀頭のまま。小三元になる。同じ聴牌でも、あがり牌で役満かどうかが変わる。
  combo_note: 役満なので、ふつうの役（役牌など）は数えない。字一色や四暗刻とは重なることがある。
  tips:
    - 三元牌の対子が 2 種類以上あるときに狙える。
    - 2 種類ポンすると、ほかの人は 3 種類目を捨てなくなる。3 種類目を自分で持っているかどうかが分かれ目。
    - 逆に、誰かが三元牌を 2 種類ポンしたら、残りの 1 種類は捨てない。
  practice: daisangen

- key: tsuuiisou
  group: yakuman
  short: 手牌のすべてを、字牌だけで作る。
  definition:
    - 手牌 14 枚が、すべて字牌（東・南・西・北・白・發・中）
    - 鳴いて作ってもよい
    - 形は「刻子 4 つ＋雀頭」か「七対子」
  notes:
    - 字牌は 7 種類しかない。七対子の形は、7 種類すべてを 2 枚ずつ持つ 1 通りだけ。
    - 大三元や小四喜・大四喜と重なることがある。
  kanji: 字＝字牌／一色＝ 1 種類 →「字牌だけ」。
  origin:
    text: 中国由来。1920 年代の英語の本に、「字牌だけの手は、中国では最高点」と書かれている。
    certainty: 確実
  examples:
    - title: 字一色
      hand: "333z66z77z"
      win: "6z"
      melds: ["pon 111z", "pon 555z"]
      note: 東・白をポン、西は暗刻、發と中の双碰待ち。
    - title: 字一色（七対子の形）
      hand: "1122334455667z"
      win: "7z"
      note: 7 種類の字牌が、2 枚ずつ。
  traps:
    - title: 刻子が 1 組だけ数牌
      hand: "333z99m77z"
      win: "9m"
      melds: ["pon 111z", "pon 555z"]
      expect: win
      why: 999萬 が数牌。14 枚すべてが字牌でなければならない。この手は混一色・対々和・混老頭など（倍満）で、役満ではない。
    - title: 雀頭が数牌
      hand: "333z9m"
      win: "9m"
      melds: ["pon 111z", "pon 555z", "pon 666z"]
      expect: win
      why: 雀頭の 9萬 が数牌。1 枚でも数牌があると、字一色にならない。
  combo_note: 役満なので、ふつうの役（混一色・対々和など）は数えない。
  tips:
    - 配牌に字牌の対子が 4 組以上あるときに狙える。
    - 字牌はほかの人が早めに捨てるので、序盤はポンしやすい。字牌を 3 つ鳴くと、強く警戒される。
  practice: tsuuiisou

- key: shousuushii
  group: yakuman
  short: 風牌（東・南・西・北）のうち、3 種類を刻子に、残りの 1 種類を雀頭にする。
  definition:
    - 風牌のうち、3 種類が刻子（または槓子）
    - 残りの 1 種類が雀頭
    - 鳴いて作ってもよい
  notes:
    - 残りの 1 面子は、何でもよい。
    - 4 種類とも刻子にすると、大四喜。
  kanji: 四喜＝四つの喜び（風牌 4 種類のこと）／小＝ 1 種類が雀頭どまり。
  origin:
    text: >-
      麻雀のいちばん古い時期からある最高点の役「四喜和」。はじめは、大四喜と小四喜を区別しなかった。
      「四喜」は、漢詩にうたわれた四つの喜びから来た、という説明があるが、確かな裏付けは見つかっていない。
    certainty: 有力
  examples:
    - title: 2 つポンした小四喜
      hand: "333z44z56m"
      win: "7m"
      melds: ["pon 111z", "pon 222z"]
      note: 東・南・西が刻子、北が雀頭。
    - title: 門前の小四喜
      hand: "111z222z33z44z567m"
      win: "3z"
      note: 西と北の双碰待ち。どちらであがっても、3 種類が刻子、1 種類が雀頭になる。
  traps:
    - title: 風牌は 3 種類だけ
      hand: "33z456m56m"
      win: "7m"
      melds: ["pon 111z", "pon 222z"]
      expect: win
      why: 北が 1 枚もない。4 種類すべてを使う（3 種類が刻子、1 種類が雀頭）のが小四喜。この手は、役牌と混一色。
    - title: 4 種類とも刻子
      hand: "444z9m"
      win: "9m"
      melds: ["pon 111z", "pon 222z", "pon 333z"]
      expect: win
      why: 4 種類とも刻子なら、上位の大四喜になる。
  combo_note: 役満なので、ふつうの役（役牌・混一色など）は数えない。字一色や四暗刻とは重なることがある。
  tips:
    - 風牌の対子が 3 種類以上あるときに狙える。
    - 風牌を 2〜3 種類ポンすると、強く警戒される。残りの風牌は出てこなくなる。
  practice: shousuushii

- key: daisuushii
  group: yakuman
  short: 風牌（東・南・西・北）の 4 種類すべてを、刻子にする。
  definition:
    - 東・南・西・北の 4 種類すべてが、刻子（または槓子）
    - 鳴いて作ってもよい
  notes:
    - ダブル役満にするルールがある（雀魂など。ルールによって異なる）。
    - 責任払い（包・パオ）：風牌を 3 種類鳴いている人に、4 種類目をポンさせた人が、ツモあがりの点を 1 人で払う、という決まりがある（ロンのときは、放銃した人と半分ずつ）。採用するかどうかは、ルールによって異なる。
  kanji: 四喜＝四つの喜び（風牌 4 種類のこと）／大＝ 4 種類とも刻子。
  origin:
    text: >-
      小四喜と同じく、もとは「四喜和」という 1 つの役。はじめは、大小を区別しなかった。
      「四喜」は、漢詩にうたわれた四つの喜びから来た、という説明があるが、確かな裏付けは見つかっていない。
    certainty: 有力
  examples:
    - title: 3 つポンした大四喜
      hand: "444z9m"
      win: "9m"
      melds: ["pon 111z", "pon 222z", "pon 333z"]
      note: 4 種類とも刻子。残りは雀頭だけなので、単騎待ちになる。雀魂のルールではダブル役満。
    - title: 門前の大四喜（双碰待ち）
      hand: "111z222z333z44z99m"
      win: "4z"
      note: 北であがれば大四喜（雀魂のルールではダブル役満）。9萬 であがると小四喜になる（下のひっかけ例）。
  traps:
    - title: 双碰待ちで、風牌でない方であがった
      hand: "111z222z333z44z99m"
      win: "9m"
      expect: win
      why: 9萬 であがると、北は雀頭のまま。大四喜ではなく、小四喜になる（どちらも役満）。
    - title: 風牌は 3 種類だけ
      hand: "567m9m"
      win: "9m"
      melds: ["pon 111z", "pon 222z", "pon 333z"]
      expect: win
      why: 北が 1 枚もない。大四喜にも小四喜にもならない。この手は、役牌と混一色。
  combo_note: 役満なので、ふつうの役は数えない。字一色や四暗刻とは重なることがある。
  tips:
    - 小四喜を作っている途中で、4 種類目も重なったときにだけ見える。
    - 風牌を 3 種類鳴いている人がいたら、4 種類目は捨てない。
  practice: daisuushii

- key: ryuuiisou
  group: yakuman
  short: 緑色だけで描かれた牌（2・3・4・6・8索 と發）だけで作る。
  definition:
    - 手牌 14 枚が、2索・3索・4索・6索・8索・發 だけでできている
    - 鳴いて作ってもよい
  notes:
    - 1・5・7・9索 は、赤い色が入っているので使えない。作れる順子は 234索 だけ。
    - 發が入っていなくても成立する。發を必ず入れる、とするルールもある（ルールによって異なる）。
  kanji: 緑＝緑色／一色 →「緑色の牌だけ」。英語の名前は All Green（オールグリーン）。
  origin:
    text: >-
      起源は説が分かれる。1920 年ごろに、上海にいた欧米人か、アメリカで考えられた All Green の訳、というのが通説。
      一方で、1924 年にアメリカで出た本は、「中国のルールでは最高点の手」と書いている。
    certainty: 諸説あり
  examples:
    - title: 鳴いた緑一色
      hand: "234s66s88s"
      win: "8s"
      melds: ["chi 234s", "pon 666z"]
      note: 234索 が 2 組、888索、發、雀頭の 66索。すべて緑色の牌。
    - title: 發のない緑一色
      hand: "2233344s666s888s"
      win: "3s"
      note: 發がなくても成立する（發を必ず入れるルールでは、清一色になる）。
  traps:
    - title: 5索 が入っている
      hand: "234s66s88s"
      win: "8s"
      melds: ["chi 456s", "pon 666z"]
      expect: win
      why: 5索 には赤い色が入っている。使える索子は 2・3・4・6・8 だけなので、順子は 234 しか作れない（この手は混一色と役牌）。
    - title: 9索 が入っている
      hand: "234s234s88s99s"
      win: "8s"
      melds: ["pon 666z"]
      expect: win
      why: 9索 には赤い色が入っている。緑一色にならない（この手は混一色と役牌）。
  combo_note: 役満なので、ふつうの役（混一色・清一色など）は数えない。
  tips:
    - 索子の 2・3・4・6・8 と發が多いときに狙える。
    - まず混一色（索子と發）として進める。緑でない牌が残らなければ、緑一色になる。
  practice: ryuuiisou

- key: chinroutou
  group: yakuman
  short: 手牌のすべてを、数牌の 1 と 9 だけで作る。
  definition:
    - 手牌 14 枚が、すべて老頭牌（数牌の 1 と 9）
    - 鳴いて作ってもよい
  notes:
    - 老頭牌は 6 種類・24 枚しかない。形は「刻子 4 つ＋雀頭」だけ（6 種類では、七対子は作れない）。
    - 字牌が入ると、混老頭（2 翻）になる。
  kanji: 清＝字牌なし／老頭＝数牌の 1 と 9。卓では「チンロー」と略す。
  origin:
    text: 中国由来。1924 年にアメリカで出た本が、「1 と 9 だけの手」を、中国のルールの最高点の役として挙げている。
    certainty: 確実
  examples:
    - title: 2 つポンした清老頭
      hand: "999s11s99p"
      win: "1s"
      melds: ["pon 999m", "pon 111p"]
      note: 5 組すべてが、1 か 9。
    - title: 1 つポンした清老頭
      hand: "999m111p99p11s"
      win: "1s"
      melds: ["pon 111m"]
      note: 9筒 と 1索 の双碰待ち。どちらであがっても清老頭。
  traps:
    - title: 字牌がある
      hand: "999s33z44z"
      win: "3z"
      melds: ["pon 999m", "pon 111p"]
      expect: win
      why: 西と北は字牌。清老頭は、数牌の 1 と 9 だけ。この手は混老頭と対々和（満貫）。
    - title: 順子がある
      hand: "999s11s23p"
      win: "1p"
      melds: ["pon 999m", "pon 111p"]
      expect: win
      why: 123筒 に 2 と 3 が入っている。この手は純全帯么九（鳴いて 2 翻）。
  combo_note: 役満なので、ふつうの役（対々和・混老頭など）は数えない。四暗刻とは重なることがある。
  tips:
    - 狙って作るのは難しい。1・9 の対子が多い手で、対々和や混老頭を進めるうちに、字牌が無くなれば成立する。
  practice: chinroutou

- key: chuuren
  yaku: [chuuren, junsei_chuuren]
  group: yakuman
  short: 1 色の数牌で「1112345678999」をそろえ、同じ色の 1 枚を加える。門前限定。
  definition:
    - 門前である（暗槓もしていない）
    - 1 色の数牌だけで、「1 が 3 枚、2〜8 が 1 枚ずつ、9 が 3 枚」の 13 枚がそろっている
    - それに、同じ色の 1〜9 のどれか 1 枚を加えた 14 枚であがる
  notes:
    - 「1112345678999」の 13 枚で聴牌すると、1〜9 のどれでもあがれる（9 面待ち）。これを純正九蓮宝燈と呼び、ダブル役満にするルールがある（雀魂など。ルールによって異なる）。
    - 萬子でなくても、筒子でも索子でもよい。
  kanji: 九＋蓮＋宝燈（宝の灯り）。「九連宝燈」とも書く。
  origin:
    text: >-
      中国由来。古い形については、説明が分かれる。「もとは 9 面待ちの形だけを指した」という説明と、
      「古くは清一色の一気通貫をこう呼び、のちに 1 と 9 を 3 枚ずつ持つ形になった」という説明がある。
      名前は、宮中で使われた大きな灯りの名から、という説明があるが、裏付けは確かめられていない。
    certainty: 諸説あり
  examples:
    - title: 九蓮宝燈
      hand: "1112345567899m"
      win: "9m"
      note: あがった 14 枚は「1112345678999」＋ 5萬。
    - title: 純正九蓮宝燈（9 面待ち）
      hand: "1112345678999m"
      win: "5m"
      note: 13 枚が「1112345678999」。1〜9 のどれが来てもあがり。雀魂のルールではダブル役満。
  traps:
    - title: 鳴いている
      hand: "2345678999m"
      win: "5m"
      melds: ["pon 111m"]
      expect: win
      why: 門前限定。ポンをすると、同じ牌の並びでも、清一色（鳴いて 5 翻）になる。
    - title: 1 が 2 枚しかない
      hand: "1123455678999m"
      win: "5m"
      expect: win
      why: 1 が 2 枚で、5 が 3 枚。「1 と 9 が 3 枚ずつ、2〜8 が 1 枚ずつ」に 1 枚を足した形だけが九蓮宝燈。この手は清一色。
  combo_note: 役満なので、ふつうの役（清一色・一気通貫など）は数えない。
  tips:
    - 門前で清一色を進めていて、1 と 9 が 3 枚ずつあるときにだけ見える。
    - 出典の統計では、約 151 万回のあがりのうち 10 回。一生に一度、と言われる役。
  practice: chuuren

- key: suukantsu
  group: yakuman
  short: 1 人で 4 回カンをして、槓子を 4 つ作る。
  definition:
    - 槓子が 4 つある
    - 暗槓・大明槓・加槓の、どれでもよい
    - 4 回カンをすると、手に残るのは 1 枚。その牌の単騎待ちで、雀頭ができればあがり
  notes:
    - 2 人以上のカンが合わせて 4 回になると、その局を流局にするルールがある（四槓散了。雀魂・天鳳は採用、Mリーグなどは不採用。ルールによって異なる）。1 人で 4 回カンしたときは、流局にしない。
    - 4 つ目のカンをさせた人の責任払い（包・パオ）にするかどうかも、ルールによって異なる。
  kanji: 四つの槓子。
  origin:
    text: >-
      どうして最高点の役になったのかは、資料によって説明が違う。「中国では 4 回目のカンで流局になるだけで、
      役ではなかった。日本で役にした」という説明と、
      「1920 年代の本に、すでに最高点の役として載っている」という説明がある。
    certainty: 諸説あり
  examples:
    - title: 四槓子
      hand: "3z"
      win: "3z"
      melds: ["minkan 2222m", "ankan 6666p", "kakan 7777s", "minkan 9999s"]
      note: 4 回カンをして、残った 1 枚の単騎待ち。
    - title: 四槓子（ツモ）
      hand: "4p"
      win: "4p"
      melds: ["ankan 1111z", "minkan 9999p", "minkan 3333s", "kakan 6666m"]
      is_tsumo: true
  traps:
    - title: 槓子 3 つと、暗刻 1 つ
      hand: "999s3z"
      win: "3z"
      melds: ["minkan 2222m", "ankan 6666p", "kakan 7777s"]
      expect: win
      why: 999索 は刻子（3 枚）。カンは 3 回なので、三槓子と対々和。4 枚目を引いてカンを宣言すれば、四槓子の聴牌になる。
    - title: 槓子 2 つと、暗刻 2 つ
      hand: "777s999s3z"
      win: "3z"
      melds: ["ankan 6666p", "minkan 2222m"]
      expect: win
      why: 手の中の 3 枚（暗刻）は、槓子ではない。この手は対々和と三暗刻。
  combo_note: 役満なので、ふつうの役（対々和・三槓子など）は数えない。
  tips:
    - 狙って作ることはできない。出典の統計では、約 151 万回のあがりのうち 1 回。
  practice_note: カンが要る役。一人練習ではカンができない（今後の版の、CPU との対局で使えるようにする予定）。
  solo: false


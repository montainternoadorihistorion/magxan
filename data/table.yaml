# 実際の卓で打つときの手順（「卓で打つとき」のページの内容）。
#
#   steps   順番にすること（番号を付けて見せる）
#   points  覚えておくこと
#   differ  卓やルールによって違うところ
#
# 競技団体の規定、雀荘のルール、解説サイトを読みくらべて、共通しているやり方を書いた（出典は下の sources）。
# 仲間内の卓では、もっと簡単に済ませることも多い。違いがあるところは differ に書く。

intro: >-
  ネット麻雀では、牌を配るのも、点数を数えるのも、機械がやってくれる。実際の卓では、全部を自分たちの手でする。
  ここには、1 局が始まってから終わるまでの手順をまとめた。細かい作法は卓によって違うので、迷ったら、その場の人に聞けばよい。

sections:
  - key: seat
    title: 席と、最初の親を決める
    summary: 東・南・西・北の牌を引いて席を決め、サイコロで最初の親（起家）を決める。
    steps:
      - 東・南・西・北の牌を 1 枚ずつ、伏せて混ぜる。4 人が 1 枚ずつ引く。
      - 東を引いた人の席を基準にする。そこから反時計回りに、南・西・北を引いた人が座る。
      - 東を引いた人が、サイコロを 2 個振る。出た目の合計で、最初の親（起家）が決まる。
      - 起家の席に、起家マーク（「東」と書かれた札）を置く。親が移っても、起家マークは動かさない。
      - 起家マークの裏は「南」になっていることが多い。南場に入ったら裏返して、いまの場を示す。
    points:
      - サイコロの目の数え方：振った人を 1 として、反時計回りに数える。5・9 ＝自分、2・6・10 ＝右隣、3・7・11 ＝向かい、4・8・12 ＝左隣。
      - 親が東家。そこから反時計回りに、南家・西家・北家。ツモる順番も、親が移る順番も、反時計回り。
    differ:
      - サイコロを 2 回振るやり方もある（1 回目に出た目の人が、もう一度振る）。競技のルールでも、2 回振りと 1 回振りに分かれる。仲間内では、1 回で決めることも多い。
      - 好きな席に座って、サイコロだけで親を決めるやり方もある。
      - 全自動卓では、サイコロはボタンを押して振る。

  - key: wall
    title: 牌を混ぜて、山を作る
    summary: 136 枚を伏せて混ぜ、4 人がそれぞれ、17 枚 × 2 段の山を自分の前に積む（手積みの卓の場合）。
    steps:
      - 136 枚（34 種類 × 4 枚）を、全部伏せる。
      - 伏せたまま、よくかき混ぜる（洗牌）。
      - 1 人ずつ、自分の前に、横 17 枚を 2 段に積む。17 枚 × 2 段＝ 34 枚。4 人で 136 枚になる。
      - 積めたら、山の右側を少し前に出して、斜めにする。4 人の山が、中央を囲む形になる。
    points:
      - 上下 2 枚の 1 組を、1 列と数える。山は 17 列。
      - 17 枚は、「5 枚、3 枚、3 枚、3 枚、3 枚」のように分けて数えると、数えやすい。
    differ:
      - 全自動卓では、混ぜるのも積むのも機械がする。山が上がってきたら、少し前に出す。
      - 配牌まで機械が配る卓もある。その場合、下の「配牌を取る」は要らない。

  - key: deal
    title: サイコロを振って、配牌を取る
    summary: 親がサイコロを振り、出た目で決まった場所から、4 枚ずつ牌を取っていく。
    steps:
      - 親が、サイコロを 2 個振る。出た目の合計で、「どの山から取るか」と「どこから取るか」の両方が決まる。
      - どの山か：親を 1 として、反時計回りに数える。5・9 ＝親の山、2・6・10 ＝南家の山、3・7・11 ＝西家の山、4・8・12 ＝北家の山。
      - どこからか：その山を積んだ人から見て、右端から、出た目と同じ数の列を残す。その左隣の列から取り始める。
      - 親 → 南家 → 西家 → 北家の順に、2 列（4 枚）ずつ取る。これを 3 周する（1 人 12 枚）。
      - 4 周目は、親が「次の列の上の牌」と「1 列とばした先の列の上の牌」の 2 枚を、いっぺんに取る（チョンチョン）。
      - 続けて、南家が「親が 1 枚目を取った列の下の牌」、西家が「とばした列の上の牌」、北家が「その下の牌」を取る。
      - 親が 14 枚、子が 13 枚になる。
    points:
      - 例：出た目が 5 なら、親の山。右から 5 列を残して、6 列目と 7 列目の 4 枚が、親の最初の 4 枚。
      - 山の牌は、積んだ人から見て左へ左へと取っていく（時計回り）。座る順番やツモる順番（反時計回り）とは逆になる。
      - 親の 14 枚目は、最初のツモに当たる。親は、ツモらずに、最初の 1 枚を捨てるところから始める。
    differ:
      - 配牌まで自動の卓では、全員に 13 枚が配られて出てくる。親は、最初の 1 枚をツモってから捨てる（取り忘れに注意）。
      - 配牌の枚数を間違えたときの扱いは、卓やルールによって違う。配り直すこともあれば、多牌・少牌の反則として扱うこともある（「反則をしてしまったら」の節）。仲間内では、4 人で話して決めればよい。

  - key: dora
    title: ドラをめくる
    summary: 取り始めた場所の右側の 14 枚（王牌）を残し、その 3 列目の上の牌を表にする。
    steps:
      - 配牌を取り始めた場所の右側（残した側）の 7 列・14 枚が、王牌。この 14 枚は、カンのときに引く嶺上牌を除いて、最後までツモらない。
      - 王牌の、取り始めた場所から数えて 3 列目の、上の牌を表にする。これがドラ表示牌。
      - めくるのは、その山の前に座っている人。先に、王牌の端（取り始めた場所の側）の列の上の牌（最初の嶺上牌）を、山の横の卓の上に下ろしてから、めくる。
    points:
      - ドラは、表示牌そのものではなく、「次の牌」。9 の次は 1。風牌は東→南→西→北→東。三元牌は白→發→中→白。
      - 残した列が 7 列に足りないとき（出た目が小さいとき）は、右隣の山に続けて数える。
      - 誰かがカンをしたら、カンをした人が、嶺上牌を 1 枚引く。嶺上牌は、王牌の端（取り始めた場所の側）の 2 列・4 枚。
      - カンのたびに、ドラ表示牌を 1 枚増やす（槓ドラ）。めくるのは、いまのドラ表示牌の隣で、嶺上牌から遠い側の列の上の牌（1 回目のカンなら、取り始めた場所から数えて 4 列目）。
      - 嶺上牌を 1 枚引くたびに、山のいちばん最後の牌 1 枚が王牌に加わる。王牌はいつも 14 枚で、ツモれる牌は 1 枚減る。
      - リーチしてあがった人は、ドラ表示牌の真下の牌（裏ドラ）もめくって数える。槓ドラがあるときは、その表示牌の真下の牌（槓裏・カンウラ）も数える。
    differ:
      - 槓ドラをいつめくるかは、ルールによって異なる。カンをしたらすぐめくるルールと、「暗槓はすぐ、大明槓と加槓は 1 枚捨てたあと」とするルールがある。嶺上牌を引く前にめくるか、あとにめくるかも、卓によって違う。
      - ドラをめくるところまで、自動でする卓もある。

  - key: turn
    title: ツモって、捨てる
    summary: 親から反時計回りに、山から 1 枚ツモって、1 枚捨てる。捨て牌は、自分の前に 6 枚ずつ並べる。
    steps:
      - 親が、最初の 1 枚を捨てる。全員の配牌が済み、ドラがめくられたのを確かめてから捨てる。
      - 次は南家。山から 1 枚ツモって、手牌から 1 枚捨てる。以下、西家・北家・親…と、反時計回りに続ける。
      - 捨てる牌は、自分の山の前（卓の中央寄り）に、表向きで、左から右へ並べる。
      - 1 列に 6 枚並べたら、7 枚目からは、手前の次の列に並べる。
    points:
      - 前の人が捨て終わるのを待ってから、ツモる（先ヅモをしない）。ポンやロンの声がかかるかもしれないため。
      - 捨てた牌は、卓に着いたら、もう戻せない。
      - ツモった牌は、手牌の右に置いたまま考えると、どれをツモったか分からなくならない。
      - ツモと打牌は、片手でする。
      - 山からツモる牌は、配牌の続き。南家の最初のツモは、親がチョンチョンで 2 枚目を取った列の下の牌。そこから先は、1 列ずつ、上の牌、下の牌の順に取る。
    differ:
      - 自分の前の山が残り少なくなったら、ほかの人が取りやすいように、卓の中央へ少し寄せる。ほかの人の前の山には触らない。

  - key: call
    title: 鳴く（チー・ポン・カン）
    summary: 声を出す → 手牌から使う牌を見せる → 捨て牌を取る → 1 枚捨てる、の順。
    steps:
      - 「チー」「ポン」「カン」と、はっきり声を出す。
      - 手牌から、使う牌を表にして見せる（チーとポンは 2 枚、大明槓は 3 枚）。
      - 相手の捨て牌を取って、見せた牌と合わせる。
      - 手牌から 1 枚捨てる。鳴いた面子は、自分の右側の端に置く。
    points:
      - 優先順位は、ロン ＞ ポン・カン ＞ チー。チーは、ポンやロンの声がないのを一呼吸確かめてから言う。
      - 鳴いた牌は、1 枚だけ横向きにして、誰から鳴いたかを示す。左隣から＝左、向かいから＝真ん中、右隣から＝右。チーは必ず左隣からなので、いつも左。
      - カンをしたら、4 枚を見せて、嶺上牌を 1 枚引き、1 枚捨てる。槓ドラもめくる。
      - 暗槓も、4 枚を全員に見せる。そのあと、2 枚（両端か、真ん中）を伏せて、右側に置く。
      - 加槓は、ポンのときに横向きにした牌の上に、4 枚目を横向きで重ねる。
      - ポン・大明槓をしたら、次にツモるのは、鳴いた人の右隣。あいだの人の番は飛ぶ。
      - 鳴いた直後に、鳴いた牌と同じ牌や、同じ順子の反対側の牌（4・5 で 3 をチーしたときの 6）は捨てられない、とするルールが多い（喰い替え）。
    differ:
      - 「取る」と「捨てる」の順番は、卓によって違う。取ってから捨てる、とする決まりが多い。
      - ポンとチーの声が同時に出たとき、決まりの上ではポンが優先。雀荘では「先に声を出した方」を優先することが多い（ほぼ同時ならポン）。

  - key: riichi
    title: リーチをかける
    summary: 「リーチ」と言う → 牌を横向きに捨てる → 1000 点棒を出す、の順。
    steps:
      - 「リーチ」と、はっきり声を出す。
      - 捨てる牌を、横向きにして河に置く。
      - その牌でロンされなければ、1000 点棒を、卓の中央寄りに出す。
    points:
      - 宣言した牌でロンされたら、リーチは成立しない。1000 点棒は出さなくてよい。
      - 横向きにした牌をチー・ポンされたら、次に捨てる牌を横向きにする。
      - リーチのあとは、手を変えられない。ツモった牌があがり牌でなければ、そのまま捨てる。
      - 出した 1000 点棒は、その局であがった人のものになる。流局したら、卓に残して、次の局であがった人がもらう。
    differ:
      - 1000 点棒がないときは、両替してから出す。
      - 持ち点が 1000 点に足りないとき、ツモる牌がもう残っていないときにリーチできるかは、ルールによって異なる。
      - リーチのあとの暗槓は、待ちや面子の形が変わらないときだけできる、とするルールが多い（細かい条件は、ルールによって異なる）。

  - key: win
    title: あがる（ロン・ツモ）
    summary: 「ロン」「ツモ」と言う → 手牌を倒す → 役と点数を言う、の順。
    steps:
      - 「ロン」または「ツモ」と、はっきり声を出す。
      - 手牌を見やすく並べてから、倒して全員に見せる。
      - リーチしていたら、裏ドラをめくって、全員に見えるようにする。
      - 役を数え上げて、点数を言う。たとえば「リーチ・ピンフ・ドラ 1、3900」。
      - ほかの 3 人も点数を確かめる。ロンなら捨てた人が、ツモなら 3 人が、点棒を払う。
    points:
      - ロンした牌は、相手の河に置いたままにする。自分の手牌に持ってこない。
      - ツモった牌は、手牌に混ぜない。手牌の右に、少し離して置く。どの牌であがったかで、符や役（平和など）が変わるため。
      - 子がツモあがりしたときは、「子が払う点・親が払う点」の順に言う。たとえば「1000・2000」。
      - 親がツモあがりしたときは、「2000 オール」のように言う（3 人が同じ点を払う）。
      - 本場があるときは、足した点も言う。1 本場につき、ロンなら 300 点、ツモなら 1 人 100 点ずつを足す。たとえば 1 本場で「3900 は、4200」「1300・2600 は、1400・2700」。
      - 親があがったら、親はそのまま続け（連荘）、本場が 1 つ増える。子があがったら、親が右隣の人に移り、本場は 0 に戻る。
      - 点棒のやり取りが済むまで、ほかの 3 人は、手牌・山・河を崩さない。
    differ:
      - 点数計算に自信がないうちは、先に「点数を教えてください」と伝えておけばよい。
      - 2 人が同じ牌でロンしたとき、2 人ともあがりにするか（ダブロン）、順番が先の 1 人だけにするか（頭ハネ）は、ルールによって異なる。

  - key: points
    title: 点棒をやり取りする
    summary: 点棒は、相手の手元に置いて渡す。受け渡しが済んでから、次の局の準備をする。
    steps:
      - 払う人は、点棒を、あがった人の手元に置く。手渡しはしない。投げない。
      - あがった人は、金額を確かめて、お釣りがあれば返す。
      - 全員の受け渡しが済んでから、牌を崩して、次の局の準備をする。
    points:
      - 点棒は、10000 点・5000 点・1000 点・100 点の 4 種類が基本。500 点棒があるセットもある。
      - 25000 点持ちの配り方の例：10000 点 1 本、5000 点 2 本、1000 点 4 本、100 点 10 本。
      - お釣りのやり取りが少なくて済むように払う。たとえば 3900 点なら、1000 点棒 4 本（お釣り 100 点）か、5000 点棒 1 本（お釣り 1100 点）で払う。
      - 1000 点棒を手元に残しておくと、リーチのときに困らない。
    differ:
      - 点棒の色や模様は、セットによって違う。打つ前に、どれが何点かを確かめる。
      - 点棒が無くなったとき、そこで試合を終わるか（飛び）、借りて続けるかは、ルールによって異なる。

  - key: draw
    title: 流局したとき
    summary: 山のツモれる牌が無くなったら流局。聴牌している人は手牌を見せ、していない人が罰符を払う。
    steps:
      - 王牌の 14 枚を残して、山が無くなったら流局。最後の牌をツモった人が、1 枚捨てて終わる。
      - 聴牌している人は、手牌を倒して見せる。聴牌していない人（ノーテン）は、手牌を伏せる。
      - ノーテンの人が、聴牌している人に、合わせて 3000 点を払う（ノーテン罰符）。
      - 親が聴牌していれば、親はそのまま（連荘）。ノーテンなら、親が次の人に移る。
      - どちらの場合も、本場が 1 つ増える。次の局の親が、本場の数だけ 100 点棒を卓の右隅に置いて示す。
    points:
      - 罰符の分け方：聴牌が 1 人なら、ほかの 3 人が 1000 点ずつ払う。2 人なら、ノーテンの 2 人が 1500 点ずつ払い、聴牌の 2 人が 1500 点ずつもらう。3 人なら、ノーテンの 1 人が 1000 点ずつ払う。全員が聴牌、または全員がノーテンなら、やり取りなし。
      - 役がなくても、形が聴牌していれば、聴牌として扱う（形式聴牌）。
      - 卓に出ているリーチ棒は、そのまま残して、次の局であがった人がもらう。
    differ:
      - 流局のとき、親が聴牌していれば連荘とするのが一般的。親があがったときだけ連荘とするルールもある（ルールによって異なる）。
      - 山が無くなる前に流局にする決まり（途中流局。九種九牌・四風連打など）を使うかどうかも、ルールによって異なる。

  - key: foul
    title: 反則をしてしまったら
    summary: 罰は、重さによって 3 段階。打つ前に、その卓の決まりを聞いておくと安心。
    steps:
      - 重い反則（チョンボ）：その局をやり直す。反則した人が、罰の点を払う。
      - 軽い反則（アガリ放棄）：局は続けるが、反則した人は、その局はあがれない。チー・ポン・カン・リーチもできず、流局のときはノーテンとして扱う決まりが多い。
      - もっと軽い反則：1000 点を卓に出して（供託）、そのまま続ける。
    points:
      - チョンボになることが多いもの：あがれない手（形ができていない・役がない・フリテンのロン）で「ロン」「ツモ」と言って手牌を倒した／聴牌していないのにリーチして流局した／山や河を崩して、続けられなくした。
      - アガリ放棄になることが多いもの：手牌の枚数が多い・少ない（多牌・少牌）／間違ったチー・ポン・カン／先ヅモ／「ロン」と言ったが、手牌は倒していない。
      - チョンボの罰は、満貫ぶんを払うのが一般的。子のチョンボなら、親に 4000 点、子 2 人に 2000 点ずつ。親のチョンボなら、子 3 人に 4000 点ずつ。
    differ:
      - チョンボの罰を、親も子も「3 人に 3000 点ずつ」とするルールもある。
      - 親がチョンボしたとき、親が移るかどうかも、卓によって違う。
      - 仲間内では、はじめのうちは罰なしでやり直す、と決めておくのもよい。

  - key: manner
    title: 気持ちよく打つために
    summary: 声ははっきり、動作はていねいに。相手の打ち方を責めない。
    steps:
      - 始める前に「よろしくお願いします」、終わったら「ありがとうございました」と言う。
      - チー・ポン・カン・リーチ・ロン・ツモは、全員に聞こえる声で言う。声が先、動作はあと。
      - 前の人が捨て終わってから、ツモる。
      - 牌は静かに置く。卓に叩きつけない。
      - 長く考えるときは、「すみません」と一言断る。
    points:
      - 自分の手牌について、嘘や紛らわしいことを言わない。鳴こうとして、やめる素振りも見せない。
      - 自分の手牌や山の牌を、ほかの人に見せない。ほかの人の手牌・山・捨て牌には、触らない。
      - あがれなかった手を、開いて見せない。ほかの人の打ち方や放銃を、責めない。
      - 対局中は、スマホを触らない。
    differ:
      - どこまで厳しく守るかは、卓によって違う。仲間内の麻雀では、細かいマナーを求めすぎないことも大事、と書いている解説もある。

